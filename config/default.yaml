# Configuration par défaut. Chemins relatifs au dossier de lancement (racine du dépôt).
# Surcharge : blanci --config mon_fichier.yaml <commande> (fusion clé par clé).

paths:
  raw: data/raw                    # data/raw/{2023,2026}/<site>/<micro>/*.wav — lecture seule
  db: data/db/blanci.sqlite
  embeddings: data/embeddings
  tokens: data/tokens               # jetons des fenêtres du benchmark (sonde attentive)
  label_imports: data/labels/imports   # fichiers reçus, jamais modifiés
  models: data/models
  frozen_test: data/frozen_test        # jeu gelé, lecture seule
  reports: data/reports
  exports: data/exports             # extraits audio pour un outil externe (YAPAT…)

audio:
  # Formats inventoriés (lus par libsndfile). Les Song Meter écrivent en WAV ou en FLAC.
  suffixes: [".wav", ".flac"]
  # Canal lu : 0 = premier micro (gain 6 dB), 1 = second micro (gain 18 dB), mean = moyenne.
  # Mesuré sur 91 enregistrements (DECISIONS n° 50) : deux micros distincts, même lisibilité
  # des notes d'A. blanci (écart médian +0,2 dB), mais le micro à 18 dB sature 3 fois plus.
  channel: 0

recorder:
  # Utilisé seulement si l'en-tête GUANO du WAV est absent ou sans fuseau (toujours en FLAC).
  # Heure des noms de fichiers Song Meter = heure locale réglée sur l'enregistreur. [À VÉRIFIER]
  filename_utc_offset_h: -3        # Guyane : UTC−3, pas d'heure d'été

signal:
  note_max_s: 0.103                # durée max d'une note d'A. blanci (0,090–0,103 s)
  note_dur_s: [0.07, 0.13]         # durées acceptées pour un onset (marge autour de 0,090–0,103 s)
  band_hz: [4400, 5500]            # bande de la note (fréquence dominante 4,48–5,41 kHz)
  ioi_range_s: [1.2, 1.906]        # intervalle entre notes d'A. blanci (moyenne 1,414 s)
  onset_k_mad: 4.0                 # seuil d'enveloppe = médiane + k × MAD (en dB)

# Heures locales à traiter en priorité (Courtois et al. 2025) : [début, fin[.
peak_hours_local: [[7, 9], [15, 17]]

# Grilles de fenêtres, indépendantes de l'encodeur (§4). Pas ≤ moitié de la fenêtre (§1).
grids:
  w3: {window_s: 3.0, hop_s: 1.5}
  w5: {window_s: 5.0, hop_s: 2.5}

qc:
  # Drapeaux audio (DECISIONS n° 79) : silencieux et micro dans sac écartent du corpus,
  # pluie et saturation sont des remarques. Calculés pendant `embed` (sur l'audio déjà lu).
  during_embed: true
  silent_dbfs: -70.0               # RMS en dessous : enregistrement muet
  clip_fraction: 0.0001            # fraction d'échantillons saturés au-dessus : saturation
  # Énergie > 2 kHz / énergie totale en dessous : micro dans sac. Calibré (DECISIONS n° 76,
  # 81) : sac 0,001–0,30, enregistrements à A. blanci ≥ 0,265 ; 0,2 en signale 6 sur 8.
  in_bag_hf_ratio: 0.2
  rain_flatness: 0.5               # platitude spectrale 1–10 kHz au-dessus...
  rain_min_dbfs: -35.0             # ...et niveau au-dessus : pluie
  # Drapeaux calculés sur l'inventaire seul (sans lire l'audio), recalculés après chaque
  # inventaire ou par `blanci flag`. Un enregistrement signalé n'est jamais encodé.
  expected_duration_s: 120.0       # programme des Song Meter : 2 min toutes les 30 min
  duration_tolerance_s: 1.0        # au-delà : duration_off (test, déclenchement manuel)
  campaign_gap_days: 7             # trou plus long dans la série d'un micro : sort du relevé


labels:
  import:
    # Colonnes reconnues dans les fichiers d'annotation (casse et accents ignorés).
    # À compléter au premier fichier réel si une colonne n'est pas détectée.
    columns:
      file: [fichier, file, filename, nom_fichier, nom, enregistrement, recording, audio]
      offset_s: [timecode, debut, start, offset, offset_s, start_s, debut_s, temps, time, begin]
      comment: [commentaire, commentaires, comment, comments, remarque, remarques, notes]
      # Colonne qui tranche : « vérif manuelle » du fichier reçu. Son texte sert aussi de
      # commentaire (il nomme souvent le faux ami ou la qualité).
      verdict: [verif_manuelle, verif, verification, validation, valide, confirme, controle,
                verif_humaine, verifie]
      label: [label, etiquette, classe, class]
      score: [score, score_modele, score_biophonia, confiance, confidence, proba, probabilite]
      quality: [qualite, quality]
      site: [site]
      mic_id: [micro, mic, mic_id, capteur, enregistreur]
    offset_unit: seconds           # seconds | window_index (indice de fenêtre Biophonia)
    window_s: 3.0                  # durée des fenêtres annotées (convention Biophonia)
    annotator: expert

# Encodeurs (§2). La f_e et la durée de fenêtre sont lues dans le modèle ; la grille en découle.
# Noms vérifiés contre bacpipe 1.3.5 (DECISIONS n° 64).
encoders:
  # Chevauchement de deux fenêtres voisines (DECISIONS n° 89) : 0 = fenêtres jointives (grille
  # standard, une note peut être coupée), 0,99 = maximal. pas = fenêtre × (1 − chevauchement),
  # au centième de seconde. 0,5 = demi-fenêtre (§1). Hors 0,5, `embed` écrit un stock séparé
  # (<encodeur>@o<%>) ; volume × 0,5 / (1 − chevauchement) : 50 fois plus de fenêtres à 0,99.
  overlap: 0.5
  batch_size: 64
  models:
    birdmae: {backend: bacpipe, model: birdmae}
    # bacpipe charge Bird-MAE-Huge (lent sur l'i5) ; le §7 prévoit la version Base.
    birdmae_base: {backend: bacpipe, model: birdmae, checkpoint: DBD-research-group/Bird-MAE-Base}
    beats: {backend: bacpipe, model: beats}
    naturebeats: {backend: bacpipe, model: naturebeats}
    perch_v2:
      backend: bacpipe
      model: perch_v2
      # Logits des congénères (§2) rangés dans `scores` pendant l'encodage : générateur de
      # candidats (`blanci candidates --congeners`), sans seconde inférence.
      logit_classes: [Anomaloglossus baeobatrachus, Anomaloglossus stepheni,
                      Anomaloglossus surinamensis]
    birdnet: {backend: bacpipe, model: birdnet}     # référence du tuteur, non déployable
    # Contrôle passe-bas (§2) : birdmae n'entendant que < 8 kHz, comme un modèle à 16 kHz.
    birdmae_lp8k: {backend: bacpipe, model: birdmae, lowpass_hz: 8000}
    # « Si sans effort » (§2) :
    protoclr: {backend: bacpipe, model: protoclr}
    perch_bird: {backend: bacpipe, model: perch_bird}
    convnext_birdset: {backend: bacpipe, model: convnext_birdset}

head:
  C_grid: [0.001, 0.01, 0.1, 1.0, 10.0]
  n_splits: 5                      # plis groupés par micro, communs à tous les modèles (n° 91)
  seed: 0
  # Benchmark des têtes (`blanci heads`, DECISIONS n° 92–93).
  reference: logistic              # tête contre laquelle toutes les autres sont comparées
  cascade_fraction: 0.2            # cascade : part des fenêtres reclassées par l'attentive
  # Courbe selon le nombre d'annotations du site cible (`blanci heads-curve`) : hypothèse du
  # prototype différentiel meilleur sur les sites peu annotés.
  curve:
    by: point                      # point (micro) tant que les positifs sont tous à Mataroni
    k: [0, 1, 2, 5, 10, 20]        # enregistrements positifs du site cible à l'entraînement
    repeats: 5                     # tirages de la moitié de test par cible
    # logistic_to_prototype (R30) et lda_shrunk (R31) : entre prototype et logistique, candidats
    # naturels des sites peu annotés (DECISIONS n° 108).
    # knn:k=3 et exemplar:k=3 (R39) : les baselines par similarité, pour amorcer un site (n° 115).
    methods: [prototype, logistic, simple_prototype, exemplar, logistic_to_prototype, lda_shrunk,
              exemplar:k=3, knn, knn:k=3]

# Régularisations des têtes (DECISIONS n° 108, `blanci/regularization.py`), numérotées comme la
# liste du 25/09/2026 (documentation/regularisation.md). Toutes coupées : on les active tête par
# tête dans le nom, `blanci heads --methods logistic,logistic+R18,logistic+R19+R18=16` (« =v »
# remplace le réglage principal, noté ◆). Le nom canonique (R triées) est celui des rapports et
# des scores hors-pli : on sait toujours lesquelles ont servi. Ordre : R19/R20 → R17 → R18 →
# R21 → tête (poids R13/R15, pénalité R27/R28). Benchmark des têtes seulement (heads,
# heads-curve) : train, benchmark et fusion gardent la logistique L2 tant que rien n'est retenu.
# Ailleurs : R22 = pooling `logistic:gem` (gem2, gem5… pour un autre p), R30 = tête
# logistic_to_prototype, R31 = tête lda_shrunk, R26 = la L2 (défaut).
regularization:
  variants: []            # têtes ajoutées à `blanci heads` par défaut, ex. [logistic+R19, prototype+R19]
  by: point               # groupe de R13, R19, R20, R21, R37 : point (site/micro) ou site
  R13: {}                 # pondération : chaque micro pèse autant dans sa classe
  R15: {hard_weight: 3.0} # ◆ négatifs annotés (faux amis, espèces) × 3 face aux présumés (n° 106)
  R17: {}                 # embeddings ramenés à la norme 1
  R18: {components: 32}   # ◆ ACP ajustée sur l'entraînement de chaque pli
  R19: {}                 # centrage : − moyenne de tout le stock du micro (sans labels)
  R20: {eps: 1.0e-6}      # AdaBN : (x − moyenne du micro) / écart-type du micro
  # Retrait des directions qui trahissent le micro, sur les négatifs du pli. means : les écarts
  # entre moyennes des micros (solution fermée, ≤ micros − 1 directions, principe de LEACE) ;
  # inlp : classifieur de micros itéré (◆ tours au plus, directions au plus, C, arrêt dès que le
  # micro n'est plus prédit mieux que le hasard + tolerance). inlp retire trop de directions
  # quand les micros sont très séparés (constaté sur données simulées) : means par défaut.
  R21: {method: means, iterations: 3, max_directions: 128, C: 1.0, tolerance: 0.05}
  R27: {}                 # pénalité L1 (lasso)
  R28: {l1_ratio: 0.5}    # ◆ Elastic Net : part de L1 (0 = L2, 1 = L1)
  # Poids des classes (n / 2·n_classe)^power au lieu de « balanced » (power = 1, le défaut des
  # têtes) : ◆ 0 = aucun rééquilibrage, 0.5 = entre les deux (n° 116). Têtes logistiques et pertes.
  R36: {power: 0.0}
  # Un biais par micro (groupe `by`), a priori N(0, σ²), ◆ σ = scale en logit (indépendant de C).
  # σ petit = biais très pénalisés. 3 : défaut provisoire, à choisir sur la base complète
  # (logistic+R37=0.3, =1, =3, =10 ; n° 119). Micro absent de l'entraînement : biais commun
  # (n° 116). logistic, cascade, loss:<nom>.
  R37: {scale: 3.0}
  # Têtes entraînées avec torch (n° 117) : attentive (R40–R42, R45–R47) et gated (R40, R42, R46).
  R40: {grid: [1.0e-4, 1.0e-3, 1.0e-2, 1.0e-1], n_splits: 3}  # weight decay, validation groupée
  R41: {weight_decay: 1.0e-2}          # ◆ AdamW au lieu de la L2 d'Adam (1e-3 couplé par défaut)
  # Arrêt précoce : dans chaque pli groupé interne, courbe du critère de validation à chaque
  # époque (◆ monitor : ap ou loss) ; l'époque qui optimise la courbe moyenne est retenue, puis la
  # tête est réentraînée sur tout le pli d'entraînement pour ce nombre d'époques (au plus
  # max_epochs). Les deux critères se comparent dans un même run : attentive+R42=ap,
  # attentive+R42=loss. ap : défaut provisoire, à trancher sur la base complète (n° 117, 119).
  R42: {monitor: ap, max_epochs: 300, n_splits: 3}
  R45: {p: 0.2}                        # ◆ dropout des jetons avant l'attention
  R46: {p: 0.2}                        # ◆ dropout des dimensions du vecteur agrégé
  R47: {strength: 1.0e-2}              # ◆ λ de ½λ‖w − w_logistique‖²

benchmark:
  negatives_per_positive: 20       # négatifs appariés présumés, ratio 1:20 à 1:50 (§2)
  # Négatifs appariés présumés, toujours du même micro (DECISIONS n° 88, 101) :
  #   nearest   : les fenêtres les plus proches dans le temps, dans l'enregistrement positif
  #               lui-même d'abord (jamais sur une annotation positive, jamais entre deux
  #               positifs : faux négatif suspect), puis le même jour, puis un autre jour.
  #               Risque : si A. blanci chante tout l'enregistrement (H20), les voisines d'un
  #               positif en contiennent — écouter une vingtaine de ces négatifs ;
  #   other_day : même créneau horaire (± slot_tolerance_min), un autre jour ;
  #   same_day  : même jour, les enregistrements les plus proches, à au moins
  #               same_day_min_gap_min (et au plus same_day_min_gap_min + slot_tolerance_min).
  #               Meilleur témoin du fond sonore, mais A. blanci chante par épisodes : le plus
  #               proche est aussi le plus susceptible de la contenir ;
  #   mixed     : moitié autre jour, moitié même jour.
  pairing: nearest
  slot_tolerance_min: 30           # même micro, créneau horaire à ± 30 min
  same_day_min_gap_min: 30         # 30 = l'enregistrement voisin (programme : 2 min / 30 min)
  n_boot: 1000
  precisions: [0.1, 0.5]

# Réentraînement sans intervention (§4, M5) : la nouvelle tête n'est adoptée que si, sur le
# jeu gelé, son AP (enregistrements) et son rappel au seuil ne perdent pas plus que ceci.
retrain:
  tolerance: 0.02

# Courbes d'activité (§6 niveau 3, M4) : patrons publiés par Courtois et al. 2025 (jeu 2023).
activity:
  reference:
    peak_hours: [[7, 9], [15, 17]]     # heures locales de pic
    high_months: [1, 2, 3, 4]          # activité forte
    low_months: [7, 8, 9, 10]          # activité quasi nulle
  min_correlation: 0.5                 # corrélation des courbes en dessous : alerte (§11, 6)

aggregate:
  # Règle enregistrement (§1), à calibrer sur les 20 enregistrements écoutés en entier.
  min_positive_windows: 3          # en dessous : « suspect » (détection isolée)
  min_span_s: 10.0                 # fenêtres positives étalées sur moins : « suspect »

fusion:
  # Fusion à N entrées (DECISIONS n° 94), `blanci fusion` (production) et `blanci fusion-bench`.
  # logistic (poids appris, C fixé) | logistic+R50 (poids appris, C par validation groupée) |
  # weighted (poids ci-dessous) | weight_grid (poids cherchés) | mean | rank_mean | max (règle
  # OU) | min (règle ET).
  method: logistic
  C: 1.0                           # méthode logistic : C fixé
  C_grid: [0.001, 0.01, 0.1, 1.0, 10.0]  # méthode logistic+R50 : C par validation groupée (n° 120)
  # Poids fixés à la main (method: weighted) : « quel expert écouter en priorité ? ». Entrées
  # sans poids : elles se partagent le reste jusqu'à 1. Ex. {head: 0.7}.
  weights: {}
  grid_step: 0.1                   # weight_grid : pas de la grille des poids
  # Autres entrées (ensemble de modèles) : head:<encodeur> (sa tête logistique, hors-pli,
  # ramenée sur la grille de l'encodeur principal), congeners:<perch_v2…> (logits congénères).
  sources: []
  benchmark_methods: [logistic, logistic+R50, weighted, weight_grid, mean, rank_mean, max, min]
  # Emplacements comparés par `fusion-bench` ([] = module séquentiel absent, tête seule).
  benchmark_positions:
    - []
    - [upstream]
    - [parallel]
    - [downstream]
    - [parallel, downstream]
    - [upstream, parallel, downstream]

# Module séquentiel et seuillage spectral, fusionnés (DECISIONS n° 95, 103), `sequential.py` :
# les mêmes descripteurs du signal, placés là où `position` le dit (liste, [] = pas du tout).
#   upstream   (amont) : avant l'encodeur — transformations du son et portes ci-dessous
#                        (`upstream`) ; à l'encodage, `--upstream a,b` les choisit pour une
#                        commande ; dans la chaîne de décision, les portes notes et rhythm
#                        (sinon notes à son seuil) ;
#   parallel           : descripteurs de rythme (audio) fusionnés avec le score de la tête ;
#   downstream (aval)  : descripteurs de persistance (scores de la tête sur l'enregistrement).
# Défaut : la fusion telle qu'elle était (parallèle + aval).
sequential:
  position: [parallel, downstream]
  # Descripteurs fusionnés avec la tête (§3) : ≤ 4, car il faut ~10 enregistrements positifs
  # indépendants par coefficient (51 aujourd'hui → 5 coefficients). L'emplacement dit lesquels
  # entrent vraiment. Rythme (fenêtre) : onset_rate_hz, ioi_median_s, ioi_cv,
  # frac_ioi_blanci, frac_ioi_short. Persistance (enregistrement) : frac_windows, n_positive,
  # longest_run, n_isolated (faux positifs suspects), span, n_gaps (faux négatifs suspects).
  columns: [frac_ioi_blanci, onset_rate_hz, frac_windows, longest_run]
  # Une fenêtre négative encadrée de positives à moins de ce rayon (s) est un faux négatif
  # suspect (DECISIONS n° 102) : jamais tirée comme négatif présumé, signalée si annotée.
  gap_radius_s: 6.0
  # En amont (DECISIONS n° 90, 103). Tout est coupé : `enabled` choisit les fonctionnalités,
  # `position: [upstream, …]` les met en service. Seuils provisoires, à régler avec
  # `blanci upstream-bench` (positifs perdus contre fenêtres arrêtées).
  upstream:
    # Transformations : le son donné à l'encodeur change → autre encodeur, stock <nom>+<étiq.>.
    bandpass: {enabled: false, band_hz: [3000, 7000], order: 4}
    denoise: {enabled: false, strength: 1.0, floor: 0.1}   # soustraction du fond médian
    # Portes : une fenêtre qui ne passe pas n'est pas encodée, son score est le plus bas.
    # Stock <nom>+g-<portes>. Notes et rythme : comptés sur les débuts de notes (les mêmes
    # qu'en parallèle) ; énergie et contraste : sur le son de la fenêtre.
    gates:
      combine: all                                 # all : toutes les portes ; any : une suffit
      band_energy: {enabled: false, min_db: 6.0}   # pic en bande au-dessus de la médiane
      band_contrast: {enabled: false, min_db: 3.0} # idem, rapporté aux bandes voisines
      notes: {enabled: false, min_count: 1}        # débuts de notes de durée compatible
      rhythm: {enabled: false, min_count: 1}       # intervalles entre notes d'A. blanci

# Détecteurs audio → score, sans encodeur de fondation (DECISIONS n° 97, `blanci/detectors/`).
# Emplacements réservés, `blanci detector-bench --detector <nom>` les jugera sur les mêmes plis.
detectors:
  distilled: {band_hz: [3000, 7000]}   # distillation de la chaîne gelée (§3, après M4)
  homemade: {band_hz: [3000, 7000]}    # modèle fait maison, entraîné sur les labels

# Fine-tuning / LoRA de l'encodeur (DECISIONS n° 97, `blanci/finetune.py`) : emplacement réservé,
# conditionné (§3). Un encodeur adapté sort en paquet ONNX et se branche comme les autres.
finetune:
  method: lora                      # lora | full
  lora: {rank: 8, alpha: 16, dropout: 0.1, target_modules: [q_proj, v_proj]}
  epochs: 10
  lr: 1.0e-4
  per_fold: true                    # un encodeur par pli : sinon le benchmark fuit

cluster:
  # Voie non supervisée (§5 bis) : HDBSCAN sur ACP. Seuils de C1 : jugement de la feuille de route.
  pca_components: 50
  min_cluster_size: 15
  min_samples: 5
  seed: 0
  c0_sample: 20000                 # fenêtres tirées dans tout le stock
  c1_site: Mataroni
  c1_negatives: 5000               # fenêtres des mêmes micros aux mêmes heures
  c1_min_recall: 0.5               # le meilleur groupe rassemble la moitié des positifs...
  c1_min_enrichment: 20            # ...avec 20 fois plus de positifs que la moyenne...
  c1_max_ami_mic: 0.3              # ...et des groupes qui ne sont pas des micros

active:
  batch_recordings: 40             # lots de 30–50 enregistrements (§5)
  mix: [0.6, 0.2, 0.2]             # incertains, scores maximaux, aléatoire stratifié (micro, heure)

# Outil de sélection (`blanci select`, DECISIONS n° 99) : réglages des méthodes.
selection:
  cluster_min_checked: 10          # écoutes, toutes du même label, avant l'étiquetage en bloc
  # Gabarit d'échantillonnage phénologique (à affiner avec Courtois et al. 2025) : strates
  # priorité (heures × mois forts), secondaire (heures × mois secondaires), hors strates.
  phenology:
    priority_hours: [[7, 9], [15, 17]]
    priority_months: [1, 2, 3, 4]
    secondary_months: [11, 12]
    site_hours: {Molokoi: [[7, 17]]}   # probabilité de détection ≈ 1 de 7 à 17 h (§5)
    shares: {priority: 0.6, secondary: 0.2, outside: 0.2}
  # Passerelle YAPAT : traduction de ses étiquettes vers le schéma de labels (à compléter au
  # premier export réel, son format n'est pas documenté).
  yapat_label_map: {}
