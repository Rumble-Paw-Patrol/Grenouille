# Configuration par défaut. Chemins relatifs au dossier de lancement (racine du dépôt).
# Surcharge : blanci --config mon_fichier.yaml <commande> (fusion clé par clé).

paths:
  raw: data/raw                    # data/raw/{2023,2026}/<site>/<micro>/*.wav — lecture seule
  db: data/db/blanci.sqlite
  embeddings: data/embeddings
  tokens: data/tokens               # jetons des fenêtres du benchmark (sonde attentive)
  label_imports: data/labels/imports   # fichiers reçus, jamais modifiés
  models: data/models
  frozen_test: data/frozen_test        # jeu gelé, lecture seule
  reports: data/reports

audio:
  # Formats inventoriés (lus par libsndfile). Les Song Meter écrivent en WAV ou en FLAC.
  suffixes: [".wav", ".flac"]
  # Canal lu : 0 = premier micro (gain 6 dB), 1 = second micro (gain 18 dB), mean = moyenne.
  # Mesuré sur 91 enregistrements (DECISIONS n° 50) : deux micros distincts, même lisibilité
  # des notes d'A. blanci (écart médian +0,2 dB), mais le micro à 18 dB sature 3 fois plus.
  channel: 0

recorder:
  # Utilisé seulement si l'en-tête GUANO du WAV est absent ou sans fuseau (toujours en FLAC).
  # Heure des noms de fichiers Song Meter = heure locale réglée sur l'enregistreur. [À VÉRIFIER]
  filename_utc_offset_h: -3        # Guyane : UTC−3, pas d'heure d'été

signal:
  note_max_s: 0.103                # durée max d'une note d'A. blanci (0,090–0,103 s)
  note_dur_s: [0.07, 0.13]         # durées acceptées pour un onset (marge autour de 0,090–0,103 s)
  band_hz: [4400, 5500]            # bande de la note (fréquence dominante 4,48–5,41 kHz)
  ioi_range_s: [1.2, 1.906]        # intervalle entre notes d'A. blanci (moyenne 1,414 s)
  onset_k_mad: 4.0                 # seuil d'enveloppe = médiane + k × MAD (en dB)

# Heures locales à traiter en priorité (Courtois et al. 2025) : [début, fin[.
peak_hours_local: [[7, 9], [15, 17]]

# Grilles de fenêtres, indépendantes de l'encodeur (§4). Pas ≤ moitié de la fenêtre (§1).
grids:
  w3: {window_s: 3.0, hop_s: 1.5}
  w5: {window_s: 5.0, hop_s: 2.5}

qc:
  # Drapeaux audio (DECISIONS n° 79) : silencieux et micro dans sac écartent du corpus,
  # pluie et saturation sont des remarques. Calculés pendant `embed` (sur l'audio déjà lu).
  during_embed: true
  silent_dbfs: -70.0               # RMS en dessous : enregistrement muet
  clip_fraction: 0.0001            # fraction d'échantillons saturés au-dessus : saturation
  # Énergie > 2 kHz / énergie totale en dessous : micro dans sac. Calibré (DECISIONS n° 76,
  # 81) : sac 0,001–0,30, enregistrements à A. blanci ≥ 0,265 ; 0,2 en signale 6 sur 8.
  in_bag_hf_ratio: 0.2
  rain_flatness: 0.5               # platitude spectrale 1–10 kHz au-dessus...
  rain_min_dbfs: -35.0             # ...et niveau au-dessus : pluie
  # Drapeaux calculés sur l'inventaire seul (sans lire l'audio), recalculés après chaque
  # inventaire ou par `blanci flag`. Un enregistrement signalé n'est jamais encodé.
  expected_duration_s: 120.0       # programme des Song Meter : 2 min toutes les 30 min
  duration_tolerance_s: 1.0        # au-delà : duration_off (test, déclenchement manuel)
  campaign_gap_days: 7             # trou plus long dans la série d'un micro : sort du relevé


labels:
  import:
    # Colonnes reconnues dans les fichiers d'annotation (casse et accents ignorés).
    # À compléter au premier fichier réel si une colonne n'est pas détectée.
    columns:
      file: [fichier, file, filename, nom_fichier, nom, enregistrement, recording, audio]
      offset_s: [timecode, debut, start, offset, offset_s, start_s, debut_s, temps, time, begin]
      comment: [commentaire, commentaires, comment, comments, remarque, remarques, notes]
      # Colonne qui tranche : « vérif manuelle » du fichier reçu. Son texte sert aussi de
      # commentaire (il nomme souvent le faux ami ou la qualité).
      verdict: [verif_manuelle, verif, verification, validation, valide, confirme, controle,
                verif_humaine, verifie]
      label: [label, etiquette, classe, class]
      score: [score, score_modele, score_biophonia, confiance, confidence, proba, probabilite]
      quality: [qualite, quality]
      site: [site]
      mic_id: [micro, mic, mic_id, capteur, enregistreur]
    offset_unit: seconds           # seconds | window_index (indice de fenêtre Biophonia)
    window_s: 3.0                  # durée des fenêtres annotées (convention Biophonia)
    annotator: expert

# Encodeurs (§2). La f_e et la durée de fenêtre sont lues dans le modèle ; la grille en découle
# (pas = fenêtre × grid_hop_ratio). Noms vérifiés contre bacpipe 1.3.5 (DECISIONS n° 64).
encoders:
  grid_hop_ratio: 0.5
  batch_size: 64
  models:
    birdmae: {backend: bacpipe, model: birdmae}
    # bacpipe charge Bird-MAE-Huge (lent sur l'i5) ; le §7 prévoit la version Base.
    birdmae_base: {backend: bacpipe, model: birdmae, checkpoint: DBD-research-group/Bird-MAE-Base}
    beats: {backend: bacpipe, model: beats}
    naturebeats: {backend: bacpipe, model: naturebeats}
    perch_v2:
      backend: bacpipe
      model: perch_v2
      # Logits des congénères (§2) rangés dans `scores` pendant l'encodage : générateur de
      # candidats (`blanci candidates --congeners`), sans seconde inférence.
      logit_classes: [Anomaloglossus baeobatrachus, Anomaloglossus stepheni,
                      Anomaloglossus surinamensis]
    birdnet: {backend: bacpipe, model: birdnet}     # référence du tuteur, non déployable
    # Contrôle passe-bas (§2) : birdmae n'entendant que < 8 kHz, comme un modèle à 16 kHz.
    birdmae_lp8k: {backend: bacpipe, model: birdmae, lowpass_hz: 8000}
    # « Si sans effort » (§2) :
    protoclr: {backend: bacpipe, model: protoclr}
    perch_bird: {backend: bacpipe, model: perch_bird}
    convnext_birdset: {backend: bacpipe, model: convnext_birdset}

head:
  C_grid: [0.001, 0.01, 0.1, 1.0, 10.0]
  n_splits: 5                      # plis groupés par micro
  seed: 0

benchmark:
  negatives_per_positive: 20       # négatifs appariés présumés, ratio 1:20 à 1:50 (§2)
  slot_tolerance_min: 30           # même micro, créneau horaire à ± 30 min
  n_boot: 1000
  precisions: [0.1, 0.5]

# Réentraînement sans intervention (§4, M5) : la nouvelle tête n'est adoptée que si, sur le
# jeu gelé, son AP (enregistrements) et son rappel au seuil ne perdent pas plus que ceci.
retrain:
  tolerance: 0.02

# Courbes d'activité (§6 niveau 3, M4) : patrons publiés par Courtois et al. 2025 (jeu 2023).
activity:
  reference:
    peak_hours: [[7, 9], [15, 17]]     # heures locales de pic
    high_months: [1, 2, 3, 4]          # activité forte
    low_months: [7, 8, 9, 10]          # activité quasi nulle
  min_correlation: 0.5                 # corrélation des courbes en dessous : alerte (§11, 6)

aggregate:
  # Règle enregistrement (§1), à calibrer sur les 20 enregistrements écoutés en entier.
  min_positive_windows: 3          # en dessous : « suspect » (détection isolée)
  min_span_s: 10.0                 # fenêtres positives étalées sur moins : « suspect »

fusion:
  # Descripteurs du module séquentiel ajoutés au score de la tête (§3) : ≤ 4, car il faut
  # ~10 enregistrements positifs indépendants par coefficient (51 aujourd'hui → 5 coefficients).
  # Rythme (fenêtre) : onset_rate_hz, ioi_median_s, ioi_cv, frac_ioi_blanci, frac_ioi_short.
  # Persistance (enregistrement) : frac_windows, n_positive, longest_run, n_isolated, span.
  columns: [frac_ioi_blanci, onset_rate_hz, frac_windows, longest_run]

cluster:
  # Voie non supervisée (§5 bis) : HDBSCAN sur ACP. Seuils de C1 : jugement de la feuille de route.
  pca_components: 50
  min_cluster_size: 15
  min_samples: 5
  seed: 0
  c0_sample: 20000                 # fenêtres tirées dans tout le stock
  c1_site: Mataroni
  c1_negatives: 5000               # fenêtres des mêmes micros aux mêmes heures
  c1_min_recall: 0.5               # le meilleur groupe rassemble la moitié des positifs...
  c1_min_enrichment: 20            # ...avec 20 fois plus de positifs que la moyenne...
  c1_max_ami_mic: 0.3              # ...et des groupes qui ne sont pas des micros

active:
  batch_recordings: 40             # lots de 30–50 enregistrements (§5)
  mix: [0.6, 0.2, 0.2]             # incertains, scores maximaux, aléatoire stratifié (micro, heure)
