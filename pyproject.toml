[project]
name = "grenouille"
version = "0.1.0"
description = "Détection acoustique automatique d'Anomaloglossus blanci (stage ONF Guyane)"
readme = "README.md"
# bacpipe 1.3.5 (recherche, M1) exige Python < 3.13 et numpy 1.26 : voir DECISIONS.md.
requires-python = "==3.11.*"
dependencies = [
    "numpy>=1.26,<2",
    "onnxruntime>=1.17",
    "openpyxl>=3.1",
    "pandas>=2.2,<3",
    "pyarrow>=15,<26",
    "pyyaml>=6.0",
    "scikit-learn>=1.4,<2",
    "scipy>=1.13",
    "soundfile>=0.12.1",
    "typer>=0.12",
]

[project.scripts]
blanci = "blanci.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]
# Recherche sur le Mac (M1+) : uv sync --group research. Jamais dans le livrable (§13.1).
research = [
    "bacpipe>=1.3.5",
]
# Prototype de vérification (M2) : uv sync --group app ; outil de travail, pas livrable.
app = [
    "matplotlib>=3.8",
    "streamlit>=1.35",
]

[build-system]
requires = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "blanci"
module-root = ""

[tool.ruff]
line-length = 100
target-version = "py311"
# Ruff reformate les blocs de code Python des fichiers Markdown : la documentation est
# écrite à la main, elle ne suit pas le style du dépôt.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
