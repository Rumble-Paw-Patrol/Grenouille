# Pré-benchmark AnuraSet (§2) : base, stocks et rapports séparés des données ONF.
#   uv run blanci --config anuraset/anuraset.yaml anuraset prepare
#   uv run blanci --config anuraset/anuraset.yaml anuraset profile
#   uv run blanci --config anuraset/anuraset.yaml embed --encoder perch_v2
#   uv run blanci --config anuraset/anuraset.yaml anuraset benchmark --encoders perch_v2-bacpipe1.3.5@o0
#   uv run blanci --config anuraset/anuraset.yaml anuraset heads --encoder perch_v2-bacpipe1.3.5@o0
# (fenêtres jointives, encoders.overlap: 0 : le stock porte « @o0 » dans son nom)
# Ou tout d'un coup (espèces choisies, encodage, encodeurs, têtes ; DECISIONS n° 136) :
#   uv run blanci --config anuraset/anuraset.yaml anuraset campaign --encoders perch_v2
paths:
  raw: data/external/anuraset          # l'archive est extraite sous anuraset/<site>/
  db: data/db/anuraset.sqlite
  embeddings: data/embeddings_anuraset
  tokens: data/tokens_anuraset
  reports: data/reports/anuraset
  models: data/models                  # poids des encodeurs : partagés avec le projet

# Fenêtres jointives sur AnuraSet (DECISIONS n° 137) : moitié moins de fenêtres à encoder
# qu'avec le chevauchement de 0,5 ; les chants (médiane ≤ 1 s) tiennent presque toujours
# entiers dans une fenêtre de 5 s. Un chant coupé par la jonction de deux fenêtres est gardé
# par celle qui en porte la plus grande part (n° 138). Stock séparé <encodeur>@o0.
encoders:
  overlap: 0.0
  resample: window                     # les stocks AnuraSet existants ont été encodés ainsi (n° 176)

recorder:
  filename_utc_offset_h: -3            # Brésil (sites INCT), sans importance ici

audio:
  channel: 0

qc:
  # Pas de contrôle audio : les seuils sont calibrés sur les Song Meter ONF, et les positifs
  # d'AnuraSet ne sont pas dans la table labels, donc pas protégés d'une exclusion.
  during_embed: false
  # Enregistrements d'une minute ; les 9 plus courts d'INCT20955 (26–57 s) sont signalés
  # duration_off mais encodés quand même : la campagne n'écarte aucun drapeau (n° 141).
  expected_duration_s: 60.0            # enregistrements d'une minute
  duration_tolerance_s: 1.0
  campaign_gap_days: 100000            # pas de notion de relevé ici

anuraset:
  archive: data/external/anuraset/raw_data.zip
  labels: data/external/anuraset/strong_labels.zip
  # Labels faibles (Zenodo) : les enregistrements sans aucune espèce sont de vrais négatifs,
  # encodés par la campagne ; ceux qui n'ont aucun chant daté mais signalent une espèce ne
  # sont pas encodés ; pour chaque espèce, les fichiers qui la signalent sans chant daté
  # d'elle sont écartés de son évaluation (n° 138). Chemin absent : erreur ; retirer la clé
  # pour s'en passer.
  weak_labels: data/external/anuraset/weak_labels.csv
  # Deux ou trois anoures à note brève en 3–6 kHz (§2) : à fixer après `anuraset profile`.
  species: []
  negatives_per_positive: 20
  # anuraset heads (R78) : têtes comparées, un pli par site ([] = la liste `anuraset.HEADS`).
  heads: []
  max_call_s: 5.0                      # au-delà : chœur continu, compté à part
  profile_per_species: 30              # chants lus pour la fréquence dominante
