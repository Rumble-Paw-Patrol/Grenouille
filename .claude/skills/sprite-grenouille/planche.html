<title>Sprite /*NOM*/</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Hanken+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Planche de relecture d'un sprite (ou de plusieurs grenouilles composées) : en grand avec une
   grille de pixels numérotée et, à l'ébauche et au croquis, le squelette nommé ; aux tailles
   d'affichage ; puis, si le sprite est animé, chaque position. Fond de nuit du bandeau. */
:root {
  --bg: #050B0A; --nuit: #070C0B; --surface: rgba(16, 29, 25, .72); --ink: #E9F2EC; --muted: #93A89D;
  --line: rgba(160, 210, 185, .16); --accent: #F5A53A; --gold: #FFE08A;
  --f-display: "Unbounded", "Segoe UI", system-ui, sans-serif;
  --f-body: "Hanken Grotesk", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.6; }
.page { max-width: 1100px; margin: 0 auto; padding-inline: 16px; padding-block: 36px 72px; display: grid; gap: 32px; }
h1, h2 { font-family: var(--f-display); font-weight: 500; letter-spacing: -.02em; margin: 0; }
h1 { font-size: clamp(22px, 3vw, 32px); }
h2 { font-size: 17px; }
.sous { color: var(--muted); margin: 0; max-width: 70ch; }
.eyebrow { font-family: var(--f-mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
.scene { position: relative; overflow: hidden; border-radius: 18px; border: 1px solid var(--line); background: radial-gradient(120% 140% at 0% 0%, #1A0E1C 0%, #070C0B 46%, #040807 100%); display: grid; place-items: center; padding: 28px 16px 0; }
.defile { overflow-x: auto; max-width: 100%; }
.scene canvas { display: block; height: auto; image-rendering: pixelated; image-rendering: crisp-edges; max-width: 100%; }
.defile canvas { max-width: none; }
.sol { width: 100%; height: 14px; background: #000004; border-top: 1px solid rgba(255, 210, 120, .3); }
.controles { display: flex; flex-wrap: wrap; gap: 8px; }
button { font: inherit; font-size: 13px; font-weight: 500; color: var(--ink); background: rgba(255, 255, 255, .06); border: 1px solid var(--line); border-radius: 999px; padding: 5px 14px; cursor: pointer; }
button[aria-pressed="true"] { background: linear-gradient(135deg, #F5A53A, #E4573F); color: #1A0B03; border-color: transparent; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.tailles { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 16px; align-items: end; }
.tailles figure:first-child { grid-column: 1 / -1; }
.tailles figure, .images figure { margin: 0; display: grid; gap: 8px; min-width: 0; }
.tailles .scene { padding-top: 18px; }
figcaption { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); }
.images { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); gap: 14px; }
.images .scene { padding: 12px 8px 0; }
</style>

<div class="page">
  <header style="display:grid;gap:8px">
    <div class="eyebrow">/*ETAPE*/ · rien n'est encore sur le tableau de bord</div>
    <h1>/*NOM*/ en 8-bit</h1>
    <p class="sous">/*TEXTE*/</p>
  </header>

  <section style="display:grid;gap:12px">
    <h2>En grand</h2>
    <div class="scene"><div class="defile"><canvas id="grand" data-px="6" data-grille="1"></canvas></div><div class="sol"></div></div>
    <div class="controles">
      <button type="button" id="b-squelette" aria-pressed="false">Squelette</button>
      <button type="button" id="b-grille" aria-pressed="false">Grille de pixels</button>
      <button type="button" id="b-anim" aria-pressed="true">Animation</button>
      <button type="button" id="b-mosaique" aria-pressed="true">Mosaïque de pixels</button>
    </div>
  </section>

  <section style="display:grid;gap:12px">
    <h2>Aux tailles d'affichage</h2>
    <div class="tailles">
      <figure><div class="scene"><canvas data-px="3.5"></canvas><div class="sol"></div></div><figcaption>ordinateur · 3,5 px par pixel du sprite</figcaption></figure>
      <figure><div class="scene"><canvas data-px="2.5"></canvas><div class="sol"></div></div><figcaption>portable · 2,5 px</figcaption></figure>
      <figure><div class="scene"><canvas data-px="1.5"></canvas><div class="sol"></div></div><figcaption>téléphone · 1,5 px</figcaption></figure>
    </div>
  </section>

  <section style="display:grid;gap:12px" id="positions" hidden>
    <h2>Les positions</h2>
    <p class="sous">L'animation combine gorge, flanc, paupière et tête : 24 images par grenouille. Voici chaque mouvement seul, à partir de la position de repos.</p>
    <div class="images" id="images"></div>
  </section>
</div>

<script>
const D = /*SPRITE*/null;
// un sprite seul ou une composition de plusieurs grenouilles posées sur une même toile
const C = D.grenouilles ? D : { largeur: D.largeur, hauteur: D.hauteur, grenouilles: [{ nom: "", x: 0, y: 0, sprite: D }] };
// images codées par plages : « O12 » = douze pixels de la couleur O
const POSES = [["0001", "repos"], ["1001", "gorge gonflée"], ["0101", "flanc gonflé"], ["0011", "œil fermé"], ["0000", "tête baissée"], ["0002", "tête relevée"]];
for (const g of C.grenouilles) {
  const im = g.sprite.images;
  g.img = Object.fromEntries(Object.entries(im).map(([k, rangs]) => [k, rangs.map((r) => [...r.matchAll(/(\D)(\d+)/g)].map((m) => [m[1], +m[2]]))]));
  g.anime = POSES.every(([k]) => k in im);
  g.repos = "0001" in im ? "0001" : Object.keys(im)[0];
}
const ANIME = C.grenouilles.some((g) => g.anime);
// en pixels de la toile : 24 pixels de marge à gauche et à droite, 8 en haut ; mosaïque en
// tuiles de 2, centrée sur la toile
const DX = 24, DY = 8, TUILE = 2, COL = C.largeur + 2 * DX, LIG = C.hauteur + DY;
const CX = (DX + C.largeur * 0.54) / TUILE, CY = (DY + C.hauteur / 2) / TUILE;
const RX = C.largeur * 0.625 / TUILE, RY = C.hauteur * 0.525 / TUILE;
const calme = matchMedia("(prefers-reduced-motion: reduce)").matches;
// squelette : repères nommés (articulations, bouts des doigts, visage) et os, couleur selon le plan
const SQUELETTE = C.grenouilles.some((g) => g.sprite.reperes);
const PLAN = { devant: "#FF9A2E", corps: "#FFE05A", fond: "#3FA7FF" };
const reglages = { anim: ANIME && !calme, mosaique: true, grille: false, squelette: C.grenouilles.some((g) => g.sprite.squelette_visible) };

function scene(toile, fixe) {
  const pxCss = +toile.dataset.px, ctx = toile.getContext("2d"), avecGrille = !!toile.dataset.grille;
  const NC = COL / TUILE, NL = LIG / TUILE;
  const phases = Array.from({ length: Math.ceil(NC) * Math.ceil(NL) }, () => [Math.random() * 6.28, 0.6 + Math.random() * 1.6]);
  // chaque grenouille a ses propres rythmes, décalés
  const etats = C.grenouilles.map(() => ({ dec: Math.random() * 7, cligne: -9, prochainCligne: 1.5 + Math.random() * 3, tete: 1, prochaineTete: 3 + Math.random() * 4 }));
  let p = 1;
  function dimension() {
    const dpr = devicePixelRatio || 1;
    let px = pxCss;                // en grand : la plus grande échelle entière qui tient, 2 au moins
    if (avecGrille) px = Math.max(2, Math.min(pxCss, Math.floor((toile.closest(".scene").clientWidth - 32) / COL)));
    p = Math.max(1, Math.round(px * dpr));
    toile.width = COL * p; toile.height = LIG * p;
    toile.style.width = (COL * p / dpr) + "px";
  }
  function cle(g, e, t) {
    if (fixe) return g.anime ? fixe : g.repos;
    if (!g.anime || !reglages.anim) return g.repos;
    const u = t + e.dec;
    const souffle = u % 3.2 < 1.3 ? 1 : 0;
    const gorge = u % 7 < 2.4 && u % 0.6 < 0.3 ? 1 : 0;
    if (t > e.prochainCligne) { e.cligne = t; e.prochainCligne = t + 3 + Math.random() * 4.5 + (Math.random() < 0.25 ? -2.8 : 0); }
    const yeux = t - e.cligne < 0.13 ? 1 : 0;
    // tête : la plupart du temps droite, parfois un peu baissée ou relevée, quelques secondes
    if (t > e.prochaineTete) { const r = Math.random(); e.tete = e.tete !== 1 ? 1 : r < 0.5 ? 0 : 2; e.prochaineTete = t + (e.tete === 1 ? 4 + Math.random() * 5 : 1.6 + Math.random() * 2.4); }
    return `${gorge}${souffle}${yeux}${e.tete}`;
  }
  function dessiner(t) {
    ctx.clearRect(0, 0, toile.width, toile.height);
    if (reglages.mosaique) {
      const q = p * TUILE, jeu = Math.max(1, Math.round(q / 7));
      for (let y = 0; y < NL; y++) for (let x = 0; x < NC; x++) {
        const d = Math.hypot((x - CX) / RX, (y - CY) / RY);
        if (d >= 1) continue;
        const [ph, v] = phases[y * Math.ceil(NC) + x];
        const a = (1 - d) * (1 - d) * (reglages.anim ? 0.1 + 0.1 * Math.sin(t * v + ph) : 0.16);
        if (a < 0.015) continue;
        ctx.fillStyle = `rgba(245, 165, 58, ${a.toFixed(3)})`;
        ctx.fillRect(x * q + jeu, y * q + jeu, q - jeu, q - jeu);
      }
    }
    C.grenouilles.forEach((g, k) => {
      const img = g.img[cle(g, etats[k], t)], pal = g.sprite.palette;
      for (let y = 0; y < img.length; y++) {
        let x = 0;
        for (const [c, n] of img[y]) {
          if (c !== ".") { ctx.fillStyle = pal[c]; ctx.fillRect((x + g.x + DX) * p, (y + g.y + DY) * p, n * p, p); }
          x += n;
        }
      }
    });
    if (SQUELETTE && reglages.squelette) for (const g of C.grenouilles) {
      const r = g.sprite.reperes;
      if (!r) continue;
      const X = (x) => (x + g.x + DX) * p, Y = (y) => (y + g.y + DY) * p;
      ctx.lineWidth = Math.max(1, p / 3);
      for (const [a, b, plan] of g.sprite.os) {
        ctx.strokeStyle = PLAN[plan]; ctx.beginPath();
        ctx.moveTo(X(r[a][0]), Y(r[a][1])); ctx.lineTo(X(r[b][0]), Y(r[b][1])); ctx.stroke();
      }
      ctx.font = `${Math.max(10, p * 1.7)}px "JetBrains Mono", monospace`; ctx.textAlign = "left"; ctx.textBaseline = "middle";
      for (const [nom, [x, y, plan]] of Object.entries(r)) {
        ctx.fillStyle = PLAN[plan]; ctx.strokeStyle = "#000";
        ctx.beginPath(); ctx.arc(X(x), Y(y), Math.max(2, p * 0.6), 0, 6.283); ctx.fill(); ctx.lineWidth = 1; ctx.stroke();
        if (avecGrille) { ctx.lineWidth = 3; ctx.strokeText(nom, X(x) + p, Y(y)); ctx.fillText(nom, X(x) + p, Y(y)); }
      }
    }
    // grille de pixels de la toile, numérotée tous les 10, pour désigner un pixel précis
    if (avecGrille && reglages.grille) {
      for (let i = 0; i <= C.largeur; i++) {
        ctx.fillStyle = i % 10 ? "rgba(140, 220, 255, .10)" : "rgba(140, 220, 255, .38)";
        ctx.fillRect((i + DX) * p, DY * p, 1, C.hauteur * p);
      }
      for (let j = 0; j <= C.hauteur; j++) {
        ctx.fillStyle = j % 10 ? "rgba(140, 220, 255, .10)" : "rgba(140, 220, 255, .38)";
        ctx.fillRect(DX * p, (j + DY) * p, C.largeur * p, 1);
      }
      ctx.fillStyle = "#BFEFFF"; ctx.font = `${Math.max(9, p * 1.6)}px "JetBrains Mono", monospace`; ctx.textBaseline = "middle";
      ctx.textAlign = "right";
      for (let j = 0; j <= C.hauteur; j += 10) ctx.fillText(String(j), (DX - 1) * p, (j + DY) * p);
      ctx.textAlign = "center"; ctx.textBaseline = "bottom";
      for (let i = 0; i <= C.largeur; i += 10) ctx.fillText(String(i), (i + DX) * p, (DY - 1) * p);
    }
  }
  dimension();
  addEventListener("resize", dimension);
  return dessiner;
}

const scenes = [...document.querySelectorAll("canvas[data-px]")].map((c) => scene(c));
if (ANIME) {
  document.getElementById("positions").hidden = false;
  const grille = document.getElementById("images");
  for (const [cle, nom] of POSES) {
    const c = document.createElement("canvas"); c.dataset.px = "2";
    const f = document.createElement("figure"), s = document.createElement("div"), cap = document.createElement("figcaption");
    s.className = "scene"; s.append(c);
    cap.textContent = nom;
    f.append(s, cap); grille.append(f);
    scenes.push(scene(c, cle));
  }
} else document.getElementById("b-anim").hidden = true;
function bascule(id, cle) {
  const b = document.getElementById(id);
  b.setAttribute("aria-pressed", String(reglages[cle]));
  b.addEventListener("click", () => { reglages[cle] = !reglages[cle]; b.setAttribute("aria-pressed", String(reglages[cle])); scenes.forEach((d) => d(performance.now() / 1000)); });
}
if (!SQUELETTE) document.getElementById("b-squelette").hidden = true;
bascule("b-anim", "anim"); bascule("b-mosaique", "mosaique"); bascule("b-grille", "grille"); bascule("b-squelette", "squelette");
let dernier = -1;
function boucle(ms) {
  const t = ms / 1000;
  if (t - dernier >= 1 / 12) { dernier = t; scenes.forEach((d) => d(t)); }
  requestAnimationFrame(boucle);
}
scenes.forEach((d) => d(0));
requestAnimationFrame(boucle);
</script>
