<title>Tableau de bord Grenouille</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,650&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Mise en page : barre latérale fixe (sections) + colonne de lecture ; en tête, le spectrogramme
   d'un vrai chant d'A. blanci (Mataroni), centré sur sa bande (spectrogramme.py).
   Charte : celle des présentations de suivi (verts forêt, accent or). */
:root {
  --bg: #F3F7F4;
  --surface: #FFFFFF;
  --surface-2: #E8F0EB;
  --ink: #1B2A24;
  --muted: #5B6B63;
  --line: #CFDDD5;
  --deep: #0E2A24;
  --deep-ink: #E4EEE8;
  --deep-muted: #A7BFB2;
  --accent: #2A7F72;
  --accent-ink: #FFFFFF;
  --gold: #B47A12;
  --gold-soft: #F6E7C4;
  --ok: #2E7D4F;
  --ok-soft: #DDEFE3;
  --warn: #A86A00;
  --warn-soft: #F8EBCB;
  --idle: #6B7A73;
  --idle-soft: #E6ECE8;
  --bad: #B23B2A;
  --bad-soft: #F6DDD7;
  --s1: #2E8B57; --s2: #3E7CB1; --s3: #D9822B; --s4: #8A6BBE; --s5: #C0492F;
  --f-display: "Source Serif 4", Cambria, Georgia, serif;
  --f-body: "Source Sans 3", Calibri, "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --radius: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C1714; --surface: #13211D; --surface-2: #1A2B26; --ink: #E3EDE7; --muted: #9DB0A6;
    --line: #2A3E37; --deep: #08110F; --deep-ink: #E3EDE7; --deep-muted: #8FA79B;
    --accent: #5BB8A8; --accent-ink: #08110F; --gold: #E9B44C; --gold-soft: #3A2E14;
    --ok: #5FC08A; --ok-soft: #173426; --warn: #E9B44C; --warn-soft: #3A2E14;
    --idle: #8FA39A; --idle-soft: #22322D; --bad: #E07A5F; --bad-soft: #3D211B;
    --s1: #3A9E66; --s2: #4F8BD0; --s3: #C67A28; --s4: #9A7FD6; --s5: #D3604A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C1714; --surface: #13211D; --surface-2: #1A2B26; --ink: #E3EDE7; --muted: #9DB0A6;
  --line: #2A3E37; --deep: #08110F; --deep-ink: #E3EDE7; --deep-muted: #8FA79B;
  --accent: #5BB8A8; --accent-ink: #08110F; --gold: #E9B44C; --gold-soft: #3A2E14;
  --ok: #5FC08A; --ok-soft: #173426; --warn: #E9B44C; --warn-soft: #3A2E14;
  --idle: #8FA39A; --idle-soft: #22322D; --bad: #E07A5F; --bad-soft: #3D211B;
  --s1: #3A9E66; --s2: #4F8BD0; --s3: #C67A28; --s4: #9A7FD6; --s5: #D3604A;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.55; }
a { color: var(--accent); }
a:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3, h4 { font-family: var(--f-display); text-wrap: balance; line-height: 1.2; margin: 0; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--f-mono); font-size: .86em; }

.shell { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100%; }
.side { background: var(--deep); color: var(--deep-ink); position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; overflow-y: auto; padding: 22px 16px; display: flex; flex-direction: column; gap: 18px; }
.brand { display: flex; flex-direction: column; gap: 4px; }
.brand b { font-family: var(--f-display); font-size: 20px; font-weight: 650; letter-spacing: .01em; }
.brand span { color: var(--deep-muted); font-size: 12.5px; }
.brand i { font-style: italic; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a { color: var(--deep-muted); text-decoration: none; padding: 7px 10px; border-radius: 6px; font-size: 14px; display: flex; justify-content: space-between; gap: 8px; }
.nav a:hover { color: var(--deep-ink); background: rgba(255,255,255,.06); }
.nav a.actif { color: var(--deep-ink); background: rgba(255,255,255,.1); box-shadow: inset 2px 0 0 var(--gold); }
.nav small { color: var(--deep-muted); font-family: var(--f-mono); font-size: 11px; opacity: .8; }
.side .pied { margin-top: auto; color: var(--deep-muted); font-size: 12px; display: flex; flex-direction: column; gap: 6px; }
.side .pied a { color: var(--deep-ink); }

main { padding-inline: clamp(16px, 4vw, 48px); padding-block: 0 64px; min-width: 0; overflow-x: clip; }
.bande { margin-inline: calc(-1 * clamp(16px, 4vw, 48px)); background: var(--deep); color: var(--deep-ink); padding-inline: clamp(16px, 4vw, 48px); padding-block: 26px 18px; display: grid; gap: 14px; }
.bande h1 { font-size: clamp(24px, 3.2vw, 34px); font-weight: 650; }
.bande h1 i { font-weight: 650; }
.bande p { margin: 0; color: var(--deep-muted); max-width: 72ch; }
.spectro { position: relative; border-radius: 6px; overflow: hidden; background: #000004; }
.spectro img { width: 100%; height: clamp(70px, 11vw, 120px); display: block; object-fit: fill; }
.spectro .bande-f { position: absolute; left: 0; right: 0; top: 28.6%; height: 39.3%; border-block: 1px dashed rgba(233,180,76,.75); pointer-events: none; }
.spectro .axe { position: absolute; left: 6px; font-family: var(--f-mono); font-size: 10.5px; color: #F3E3C0; text-shadow: 0 0 3px #000; line-height: 1; }
.spectro-legende { display: flex; flex-wrap: wrap; gap: 4px 16px; font-family: var(--f-mono); font-size: 11px; color: var(--deep-muted); }

section.vue { padding-top: 40px; scroll-margin-top: 12px; display: grid; gap: 18px; }
.vue-tete { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; border-bottom: 1px solid var(--line); padding-bottom: 10px; }
.vue-tete h2 { font-size: 26px; font-weight: 650; }
.vue-tete p { margin: 4px 0 0; color: var(--muted); max-width: 70ch; }
.eyebrow { font-size: 11.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--accent); font-weight: 700; }

.carte { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; min-width: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; align-content: start; }
.carte h3 { font-size: 17px; font-weight: 650; }
.carte .sous { color: var(--muted); font-size: 13.5px; margin: 0; }
.carte-tete { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.grille { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.grille-2 { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); }

.tuiles { display: grid; gap: 1px; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); background: var(--line); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.tuile { background: var(--surface); padding: 14px 16px; display: grid; gap: 2px; }
.tuile b { font-family: var(--f-display); font-size: 28px; font-weight: 650; font-variant-numeric: tabular-nums; }
.tuile span { color: var(--muted); font-size: 13px; }
.tuile em { font-style: normal; font-size: 12px; color: var(--muted); font-family: var(--f-mono); }

.puce { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.puce::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.e-fait { color: var(--ok); background: var(--ok-soft); }
.e-en_cours { color: var(--warn); background: var(--warn-soft); }
.e-a_venir { color: var(--idle); background: var(--idle-soft); }
.e-bloque { color: var(--bad); background: var(--bad-soft); }
.lic-oui { color: var(--ok); background: var(--ok-soft); }
.lic-non { color: var(--bad); background: var(--bad-soft); }
.lic-autre { color: var(--warn); background: var(--warn-soft); }

.commenter { font: inherit; font-size: 12.5px; color: var(--muted); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 3px 11px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.commenter:hover { color: var(--accent); border-color: var(--accent); }
.commenter svg { width: 13px; height: 13px; }

.controles { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: flex-end; }
.champ { display: grid; gap: 4px; min-width: 0; }
.champ > span { font-size: 11.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
select, input[type="search"] { font: inherit; font-size: 14px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; max-width: 100%; }
.seg { display: inline-flex; flex-wrap: wrap; max-width: 100%; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { font: inherit; font-size: 13.5px; border: 0; background: var(--surface); color: var(--muted); padding: 6px 11px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.puces { display: flex; flex-wrap: wrap; gap: 6px; }
.choix { font: inherit; font-size: 13px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 999px; padding: 3px 10px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.choix[aria-pressed="true"] { color: var(--ink); border-color: var(--ink); background: var(--surface-2); }
.choix i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.lien-btn { font: inherit; font-size: 12.5px; background: none; border: 0; color: var(--accent); cursor: pointer; padding: 0; text-decoration: underline; }

.defile { overflow-x: auto; min-width: 0; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 700; white-space: nowrap; }
th button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; letter-spacing: inherit; text-transform: inherit; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
tbody tr:hover { background: var(--surface-2); }
.barre-cell { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
.barre-cell i { display: block; height: 6px; border-radius: 3px; background: var(--accent); }

svg text { fill: var(--muted); font-family: var(--f-body); font-size: 11.5px; }
svg .fort { fill: var(--ink); font-weight: 600; }
svg .grille-l { stroke: var(--line); stroke-width: 1; }
.graphe { width: 100%; height: auto; display: block; overflow: visible; }
.barres-sites text { font-size: 14.5px; }
.barres-sites text.dans-barre { fill: #FFFFFF; font-size: 13px; font-weight: 600; }
.barres-sites text.note { font-size: 12.5px; }
.legende { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--muted); }
.legende span { display: inline-flex; align-items: center; gap: 6px; min-width: 0; }
.legende i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
.legende .anneau { background: transparent !important; border: 2px solid var(--ink); width: 11px; height: 11px; }
.legende .trait { width: 14px; height: 2px; border-radius: 0; background: var(--ink); }
.legende .tirets { width: 14px; height: 0; border-top: 2px dashed var(--gold); border-radius: 0; background: none; }
.legende .tirets.gris { border-top-color: var(--muted); }

#bulle { position: fixed; z-index: 30; pointer-events: none; background: var(--deep); color: var(--deep-ink); font-size: 12.5px; padding: 7px 10px; border-radius: 6px; max-width: 290px; line-height: 1.4; box-shadow: 0 6px 18px rgba(0,0,0,.18); }
#bulle b { font-weight: 700; }

/* Chaîne de traitement */
.chaine { position: relative; display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); grid-auto-rows: minmax(64px, auto); gap: 46px 34px; padding: 6px 0; }
.chaine svg.liens { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.chaine svg.liens path { fill: none; stroke: var(--muted); stroke-width: 1.6; opacity: .85; }
.chaine svg.liens path.boucle { stroke: var(--gold); stroke-dasharray: 5 4; opacity: 1; }
.chaine svg.liens path.option { stroke-dasharray: 3 4; }
.noeud.option { border-style: dashed; }
.noeud { position: relative; z-index: 1; font: inherit; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 7px 9px; cursor: pointer; display: grid; gap: 5px; align-content: start; color: var(--ink); }
.noeud:hover { border-color: var(--accent); }
.noeud[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.noeud b { font-size: 13px; line-height: 1.25; hyphens: auto; -webkit-hyphens: auto; }
.noeud .etat { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; vertical-align: 1px; }
.noeud small { color: var(--muted); font-size: 11px; line-height: 1.3; }
.couloir { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; align-self: end; }
.suites-mobile { display: none; }
@media (max-width: 900px) {
  .chaine { grid-template-columns: 1fr; gap: 8px; }
  .chaine .noeud { grid-column: auto !important; grid-row: auto !important; }
  .chaine svg.liens, .couloir { display: none; }
  .suites-mobile { display: block; }
}
.detail-etape dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 14px; margin: 0; font-size: 14px; }
.detail-etape dt { color: var(--muted); }
.detail-etape dd { margin: 0; }
code { font-family: var(--f-mono); font-size: .86em; background: var(--surface-2); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }

/* Gantt */
.gantt-ligne rect.phase { rx: 4; }

/* Rapports */
.rapports { display: grid; grid-template-columns: minmax(220px, 300px) minmax(0, 1fr); gap: 18px; align-items: start; }
.liste-rapports { display: grid; gap: 6px; position: sticky; top: 12px; }
.liste-rapports button { font: inherit; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 9px 12px; cursor: pointer; color: var(--ink); display: grid; gap: 2px; }
.liste-rapports button[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
.liste-rapports b { font-size: 13.5px; }
.liste-rapports small { color: var(--muted); font-size: 12px; }
@media (max-width: 900px) { .rapports { grid-template-columns: 1fr; } .liste-rapports { position: static; } }
.md { font-size: 15px; min-width: 0; }
.md > * { max-width: 78ch; }
.md > .tbl, .md > figure, .md > pre { max-width: 100%; }
.md h1 { font-size: 24px; margin: 6px 0 12px; }
.md h2 { font-size: 20px; margin: 26px 0 8px; }
.md h3 { font-size: 17px; margin: 20px 0 6px; }
.md h4 { font-size: 15px; margin: 16px 0 4px; }
.md p { margin: 8px 0; }
.md a { overflow-wrap: anywhere; }
.md ul, .md ol { padding-left: 22px; margin: 6px 0; }
.md li { margin: 3px 0; }
.md blockquote { margin: 10px 0; padding: 4px 14px; border-left: 3px solid var(--gold); color: var(--muted); }
.md pre { background: var(--surface-2); padding: 10px 12px; border-radius: 6px; overflow-x: auto; font-size: 12.5px; }
.md pre code { background: none; padding: 0; }
.md figure { margin: 14px 0; display: grid; gap: 6px; }
.md figure img { border: 1px solid var(--line); border-radius: 6px; background: #FFFFFF; cursor: zoom-in; }
.md figcaption, .md em.legende-fig { color: var(--muted); font-size: 13.5px; }
.md table { margin: 10px 0; }
.md hr { border: 0; border-top: 1px solid var(--line); margin: 20px 0; }
.md .tbl { overflow-x: auto; }
.surligne { background: var(--gold-soft); color: inherit; border-radius: 2px; }

.galerie { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); }
.galerie figure { margin: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; display: grid; grid-template-rows: 180px auto; }
.galerie img { width: 100%; height: 180px; object-fit: cover; object-position: top left; background: #FFFFFF; cursor: zoom-in; border-bottom: 1px solid var(--line); }
.galerie figcaption { padding: 10px 12px; display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
.galerie figcaption b { color: var(--ink); font-size: 14px; text-transform: capitalize; }

#visionneuse { position: fixed; inset: 0; z-index: 40; background: rgba(4,10,8,.86); display: grid; place-items: center; padding: 24px; }
#visionneuse img { max-width: min(1400px, 100%); max-height: 86vh; background: #FFFFFF; border-radius: 6px; }
#visionneuse button { position: absolute; top: calc(14px + env(safe-area-inset-top, 0px)); right: 16px; font: inherit; color: #FFFFFF; background: rgba(255,255,255,.14); border: 0; border-radius: 999px; padding: 6px 14px; cursor: pointer; }
#visionneuse p { color: #E4EEE8; margin: 10px 0 0; font-size: 13px; text-align: center; }

.commits { display: grid; gap: 0; }
.commits div { display: grid; grid-template-columns: minmax(0, 136px) minmax(0, 1fr); gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 13.5px; }
.commits div:last-child { border-bottom: 0; }
.commits time { color: var(--muted); font-family: var(--f-mono); font-size: 12px; }
.progres { display: grid; gap: 10px; }
.progres div { display: grid; gap: 4px; }
.progres .rail { height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.progres .rail i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
.progres .lbl { display: flex; justify-content: space-between; gap: 8px; font-size: 13.5px; }
.vide { color: var(--muted); font-size: 13.5px; padding: 14px 0; }
.capture { width: 100%; border: 1px solid var(--line); border-radius: 6px; cursor: zoom-in; background: #FFFFFF; }
.etapes-plan { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr)); }
.etapes-plan li { background: var(--surface-2); border-radius: var(--radius); padding: 12px; display: grid; gap: 8px; align-content: start; }
.etapes-plan li.fort { background: var(--deep); color: var(--deep-ink); }
.etapes-plan li.fort p { color: var(--deep-muted); }
.etapes-plan .rang { width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-weight: 700; font-size: 13px; }
.etapes-plan li.fort .rang { background: var(--gold); color: var(--deep); }
.etapes-plan p { margin: 4px 0 0; font-size: 13.5px; color: var(--muted); }
.principes { margin: 0; padding-left: 18px; display: grid; gap: 6px; font-size: 14px; }

@media (max-width: 900px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .side { position: sticky; top: env(safe-area-inset-top, 0px); height: auto; z-index: 10; flex-direction: row; align-items: center; padding: 8px 16px; gap: 12px; overflow: hidden; }
  .brand span, .side .pied { display: none; }
  .brand b { font-size: 16px; }
  .nav { flex-direction: row; overflow-x: auto; gap: 2px; scrollbar-width: none; }
  .nav a { white-space: nowrap; padding: 6px 9px; font-size: 13px; }
  .nav small { display: none; }
}
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
</style>

<div class="shell" lang="fr">
  <aside class="side">
    <div class="brand"><b>Grenouille</b></div>
    <nav class="nav" id="nav" aria-label="Sections"></nav>
    <div class="pied" id="pied"></div>
  </aside>
  <main id="main">
    <header class="bande">
      <div class="eyebrow" style="color: var(--gold)">Tableau de bord du stage</div>
      <h1 id="titre"></h1>
      <p id="objectif"></p>
      <div class="spectro">
        <img src="spectrogramme.jpg" alt="Spectrogramme de 10 s d'un chant d'A. blanci enregistré à Mataroni, de 3,5 à 6,3 kHz : notes brèves et régulières vers 4,4 kHz">
        <span class="bande-f" aria-hidden="true"></span>
        <span class="axe" style="top:4px" aria-hidden="true">6,3 kHz</span>

function inline(s) {
  s = esc(s);

  s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, (m, a, u) => `<img src="${u}" alt="${a}">`);

  s = s.replace(/&lt;(https?:\/\/[^\s&]+)&gt;/g, (m, u) => `<a href="${u}" target="_blank" rel="noopener">${u.replace(/^https?:\/\//, "").replace(/\/$/, "")}</a>`);

  s = s.replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?!\w)/g, "$1<em>$2</em>");
  return s;
}
function markdown(src) {

      if (L[j].trim() === "") { if (j + 1 < L.length && /^\s+\S/.test(L[j + 1]) && L[j + 1].match(/^(\s*)/)[1].length > base) { j++; continue; } break; }
      const ind = L[j].match(/^(\s*)/)[1].length;
      if (ind > base && items.length) { items[items.length - 1].push(L[j]); j++; continue; }
      break;
    }
    const html = items.map((it) => {
      const [premier, ...reste] = it;
      const sous = reste.findIndex((r) => /^\s*([-*]|\d+\.)\s+/.test(r));
      const texte = sous === -1 ? [premier, ...reste] : [premier, ...reste.slice(0, sous)];
      const corps = sous === -1 ? "" : markdown(reste.slice(sous).map((r) => r.replace(new RegExp("^\\s{0," + (base + 2) + "}"), "")).join("\n"));
      return `<li>${inline(texte.map((t) => t.trim()).join(" "))}${corps}</li>`;
    }).join("");
    out.push(ordonnee ? `<ol>${html}</ol>` : `<ul>${html}</ul>`);
    return j;
  };
  while (i < L.length) {
    const l = L[i];

    if (/^```/.test(l)) { let j = i + 1; const b = []; while (j < L.length && !/^```/.test(L[j])) b.push(L[j++]); out.push(`<pre><code>${esc(b.join("\n"))}</code></pre>`); i = j + 1; continue; }
    const h = l.match(/^(#{1,4})\s+(.*)$/);
    if (h) { out.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`); i++; continue; }
    if (/^---+\s*$/.test(l)) { out.push("<hr>"); i++; continue; }
    if (/^\s*\|/.test(l) && i + 1 < L.length && /^\s*\|[\s:|-]+\|\s*$/.test(L[i + 1])) {
      const cells = (r) => r.trim().replace(/^\||\|$/g, "").split("|").map((c) => c.trim());
      const tete = cells(l); let j = i + 2; const rows = [];
      while (j < L.length && /^\s*\|/.test(L[j])) rows.push(cells(L[j++]));

      out.push(`<div class="tbl"><table><thead><tr>${tete.map((c) => `<th>${inline(c)}</th>`).join("")}</tr></thead><tbody>${rows.map((r) => `<tr>${r.map((c) => `<td${num(c) ? ' class="n"' : ""}>${inline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`);
      i = j; continue;

    if (/^\s*([-*]|\d+\.)\s+/.test(l)) { i = liste(i); continue; }

    if (img) {
      let leg = "";
      let j = i + 1; while (j < L.length && L[j].trim() === "") j++;
      if (j < L.length && /^\*[^*]/.test(L[j])) { const b = []; while (j < L.length && L[j].trim() !== "") b.push(L[j++]); leg = b.join(" ").replace(/^\*|\*$/g, ""); i = j; } else i++;

  // Le chemin principal sur une ligne ; dessous, la boucle d'annotation qui revient aux têtes.
  const POS = { inventaire: [1, 1], qc: [2, 1], signal: [3, 1], encodage: [4, 1],

  const detail = el("div", { class: "carte detail-etape", "data-comment-target": "" });
  const noeuds = {};
  const byId = Object.fromEntries(C.chaine.map((e) => [e.id, e]));
  const coul = { fait: "var(--ok)", en_cours: "var(--warn)", a_venir: "var(--idle)", bloque: "var(--bad)" };
  for (const e of C.chaine) {
    const [c, r] = POS[e.id] || [1, 5];

      el("small", { class: "suites-mobile" }, e.suite?.length ? "→ " + e.suite.map((x) => byId[x]?.etape || x).join(", ") : ""));
    n.addEventListener("click", () => choisir(e.id));
    noeuds[e.id] = n; box.append(n);

    detail.replaceChildren(
      el("div", { class: "carte-tete" }, el("h3", {}, e.etape), el("span", { style: "display:flex;gap:8px;align-items:center" }, puceEtat(e.etat), boutonCommenter(detail))),
      el("p", { style: "margin:0;max-width:72ch" }, e.resume),
      el("dl", {},
        el("dt", {}, "Module"), el("dd", {}, el("code", {}, e.module)),
        el("dt", {}, "Commandes"), el("dd", {}, e.commandes.length ? e.commandes.map((c) => [el("code", {}, "blanci " + c), " "]) : "à écrire"),
        e.chiffre ? [el("dt", {}, "Repère"), el("dd", {}, e.chiffre)] : null,
        el("dt", {}, "Tests"), el("dd", {}, `${e.n_tests} dans `, el("code", {}, e.tests + "/")),
        el("dt", {}, "Ensuite"), el("dd", {}, e.suite?.length ? e.suite.map((x) => byId[x]?.etape || x).join(", ") : "—")));
    if (commentaires) detail.querySelectorAll(".commenter").forEach((b) => (b.hidden = false));

    const B = box.getBoundingClientRect();
    liens.setAttribute("viewBox", `0 0 ${B.width} ${B.height}`);
    liens.append(sv("defs", {}, sv("marker", { id: "fl", viewBox: "0 0 8 8", refX: 7, refY: 4, markerWidth: 7, markerHeight: 7, orient: "auto-start-reverse" }, sv("path", { d: "M0 0L8 4L0 8z", fill: "var(--muted)" })),
      sv("marker", { id: "flb", viewBox: "0 0 8 8", refX: 7, refY: 4, markerWidth: 7, markerHeight: 7, orient: "auto-start-reverse" }, sv("path", { d: "M0 0L8 4L0 8z", fill: "var(--gold)" }))));
    const R = (id) => { const r = noeuds[id].getBoundingClientRect(); return { l: r.left - B.left, r: r.right - B.left, t: r.top - B.top, b: r.bottom - B.top, cx: (r.left + r.right) / 2 - B.left, cy: (r.top + r.bottom) / 2 - B.top }; };
    const BOUCLE = new Set(["verification>annotation", "annotation>reentrainement", "reentrainement>tetes", "score>verification"]);
    for (const e of C.chaine) for (const t of e.suite || []) {
      if (!noeuds[t]) continue;
      const a = R(e.id), b = R(t); let d;

  const seg = (options, val, f, label) => {
    const g = el("div", { class: "seg", role: "group", "aria-label": label });
    options.forEach(([v, n]) => { const b = el("button", { type: "button", "aria-pressed": String(v === val) }, n); b.addEventListener("click", () => f(v)); g.append(b); });
    return g;
  };
  const multi = (tous, set, nom, coul) => {
    const g = el("div", { class: "puces" });
    tous.forEach((v) => {
      const b = el("button", { type: "button", class: "choix", "aria-pressed": String(set.has(v)), title: v }, coul ? el("i", { style: `background:${coul(v)}` }) : null, nom(v));
      b.addEventListener("click", () => { set.has(v) ? set.delete(v) : set.add(v); b.setAttribute("aria-pressed", String(set.has(v))); dessiner(); });
      g.append(b);
    });
    return g;
  };
  const raccourcis = (tous, set) => {
    const a = el("button", { type: "button", class: "lien-btn" }, "tout"), b = el("button", { type: "button", class: "lien-btn" }, "aucun");
    a.addEventListener("click", () => { tous.forEach((v) => set.add(v)); controles(); });
    b.addEventListener("click", () => { set.clear(); controles(); });
    return el("span", { style: "display:inline-flex;gap:8px;margin-left:8px;text-transform:none;letter-spacing:0;font-weight:400" }, a, b);
  };
  function controles() {
    const S = SOURCES[etat.src];
    const encs = [...new Set(S.rows.map((r) => r.enc))].sort();
    const heads = [...new Set(S.rows.map((r) => r.head))];
    ctrl.replaceChildren(
      el("div", { class: "controles" },
        el("label", { class: "champ" }, el("span", {}, "Données"), (() => { const x = el("select", { id: "expl-source" }, Object.entries(SOURCES).map(([k, v]) => el("option", { value: k, selected: k === etat.src }, v.nom))); x.addEventListener("change", () => init(x.value)); return x; })()),
        el("div", { class: "champ" }, el("span", {}, "Unité"), seg([["fenetre", "fenêtre"], ["minute", etat.src === "regul" ? "enregistrement" : "minute"]], etat.lvl, (v) => { etat.lvl = v; controles(); }, "Unité")),
        el("div", { class: "champ" }, el("span", {}, "Lecture de l'AP"), seg([["aps", "moyenne par site"], ["ap", "poolée"]], etat.met, (v) => { etat.met = v; controles(); }, "Lecture")),
        el("div", { class: "champ" }, el("span", {}, "Affichage"), seg([["graphe", "graphique"], ["table", "tableau"]], etat.vue, (v) => { etat.vue = v; controles(); }, "Affichage"))),
      el("div", { class: "champ" }, el("span", {}, "Encodeurs", raccourcis(encs, etat.encs)), multi(encs, etat.encs, nomEnc)),
      el("div", { class: "champ" }, el("span", {}, "Têtes", raccourcis(heads, etat.heads)), multi(heads, etat.heads, tete)),
      el("div", { class: "champ" }, el("span", {}, "Espèces"), multi(ESPECES, etat.sps, (v) => v, coulEsp)));
    dessiner();
  }
  function donnees() {
    const S = SOURCES[etat.src];
    let met = etat.met, note = "";
    if (etat.src === "regul" && met === "aps" && etat.lvl !== "fenetre") { met = "ap"; note = "L'AP moyenne par site n'existe qu'à la fenêtre pour les benchmarks 01–06 : AP poolée affichée."; }
    const sps = ESPECES.filter((x) => etat.sps.has(x));
    const groupes = new Map();
    for (const r of S.rows) {
      if (r.lvl !== etat.lvl || !etat.encs.has(r.enc) || !etat.heads.has(r.head) || !etat.sps.has(r.sp)) continue;
      const k = r.enc + "|" + r.head;
      if (!groupes.has(k)) groupes.set(k, { enc: r.enc, head: r.head, v: {}, sig: {} });
      const g = groupes.get(k); g.v[r.sp] = r[met];
      if (etat.src === "regul") g.sig[r.sp] = r.diff != null ? { diff: r.diff, sig: r.sig } : null;
      else g.sig[r.sp] = comp08.get(`${r.enc}|${r.head}|${r.sp}|${etat.lvl}`) || null;
    }
    const lignes = [...groupes.values()].map((g) => {
      const vals = sps.map((x) => g.v[x]).filter((x) => x != null);
      return { ...g, moy: vals.length === sps.length && vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null, n: vals.length };
    }).sort((a, b) => (b.moy ?? -1) - (a.moy ?? -1));
    const ref = lignes.find((l) => l.enc === S.ref[0] && l.head === S.ref[1]);
    return { lignes, sps, met, note, ref };
  }
  function dessiner() {
    const { lignes, sps, met, note, ref } = donnees();
    const lect = met === "aps" ? "AP moyenne par site tenu à l'écart" : "AP poolée (tous les sites ensemble)";
    const refTxt = etat.src === "regul" ? "Anneau : écart à la logistique du même encodeur significatif après Holm." : "Anneau : écart à perch_v2 + logistique significatif après Holm.";
    res.textContent = `${lignes.length} couples · ${lect}, ${etat.lvl === "fenetre" ? "par fenêtre" : etat.src === "regul" ? "par enregistrement" : "par minute"}. ${refTxt} ${note}`;
    if (!lignes.length) { zone.replaceChildren(el("p", { class: "vide" }, "Aucune combinaison : choisir au moins un encodeur, une tête et une espèce.")); return; }
    if (etat.vue === "table") {
      zone.replaceChildren(el("div", { class: "defile" }, el("table", {},
        el("thead", {}, el("tr", {}, el("th", {}, "Encodeur"), el("th", {}, "Tête"), sps.map((x) => el("th", { class: "n" }, x)), el("th", { class: "n" }, "Moyenne"))),
        el("tbody", {}, lignes.map((l) => el("tr", {}, el("td", {}, nomEnc(l.enc)), el("td", {}, tete(l.head)),
          sps.map((x) => el("td", { class: "n", title: l.sig[x] ? `écart ${fr(l.sig[x].diff)}${l.sig[x].sig ? ", significatif (Holm)" : ""}` : null }, fr(l.v[x]) + (l.sig[x]?.sig ? " *" : ""))),
          el("td", { class: "n" }, el("strong", {}, fr(l.moy)))))))),
        el("p", { class: "sous" }, "* écart significatif après Holm."));
      return;
    }
    const W = 760, g = 300, d = 56, rh = 24, h = 26, H = h + lignes.length * rh + 30;
    const xs = (v) => g + v * (W - g - d);
    const svg = sv("svg", { viewBox: `0 0 ${W} ${H}`, class: "graphe", style: "min-width:600px", role: "img", "aria-label": "Comparaison des têtes" });
    for (const v of [0, 0.2, 0.4, 0.6, 0.8, 1]) svg.append(sv("line", { x1: xs(v), x2: xs(v), y1: h - 6, y2: H - 26, class: "grille-l" }), sv("text", { x: xs(v), y: H - 10, "text-anchor": "middle" }, fr(v, 1)), sv("text", { x: xs(v), y: h - 12, "text-anchor": "middle" }, fr(v, 1)));
    if (ref?.moy != null) svg.append(sv("line", { x1: xs(ref.moy), x2: xs(ref.moy), y1: h - 4, y2: H - 28, stroke: "var(--gold)", "stroke-width": 1.5, "stroke-dasharray": "5 4" }));
    lignes.forEach((l, i) => {
      const y = h + i * rh + rh / 2;
      if (i % 2 === 0) svg.append(sv("rect", { x: 0, y: y - rh / 2, width: W, height: rh, fill: "var(--surface-2)", opacity: 0.5 }));
      const estRef = ref && l === ref;
      svg.append(sv("text", { x: g - 12, y: y + 4, "text-anchor": "end", class: estRef ? "fort" : null }, `${nomEnc(l.enc)} · ${tete(l.head)}`.slice(0, 52)));
      const vals = sps.map((x) => l.v[x]).filter((v) => v != null);
      if (vals.length > 1) svg.append(sv("line", { x1: xs(Math.min(...vals)), x2: xs(Math.max(...vals)), y1: y, y2: y, stroke: "var(--line)", "stroke-width": 2 }));
      sps.forEach((x) => {
        const v = l.v[x]; if (v == null) return;
        const sg = l.sig[x];
        const c = sv("circle", { cx: xs(v), cy: y, r: 5, fill: coulEsp(x), stroke: sg?.sig ? "var(--ink)" : "var(--surface)", "stroke-width": sg?.sig ? 2 : 1.5 });
        survol(c, () => `<b>${esc(nomEnc(l.enc))} · ${esc(tete(l.head))}</b><br>${x} (<i>${NOMS_ESP[x]}</i>) : ${fr(v)}` + (sg ? `<br>écart à la référence ${sg.diff > 0 ? "+" : ""}${fr(sg.diff)}${sg.sig ? ", significatif (Holm)" : ", non significatif"}` : "") + `<br><span style="opacity:.75">${esc(l.head)}</span>`);
        svg.append(c);
      });
      if (l.moy != null) {
        svg.append(sv("rect", { x: xs(l.moy) - 1.5, y: y - 8, width: 3, height: 16, rx: 1.5, fill: "var(--ink)" }));
        svg.append(sv("text", { x: W - d + 8, y: y + 4, class: "fort num" }, fr(l.moy)));
      }
    });
    svg.append(sv("text", { x: W - d + 8, y: h - 12, class: "fort" }, "moy."));
    zone.replaceChildren(el("div", { class: "defile" }, svg), el("div", { class: "legende" },
      ...sps.map((x) => el("span", {}, el("i", { style: `background:${coulEsp(x)}` }), x)),
      el("span", {}, el("i", { class: "trait", style: "height:12px;width:3px" }), "moyenne"),
      el("span", {}, el("i", { class: "anneau" }), "écart significatif"),
      ref ? el("span", {}, el("i", { class: "tirets" }), "référence : perch_v2 · logistique") : null));
  }
  init("adaptees");
}

function lecture(id, titre, sous, texte, eyebrow) {
  const s = section(id, titre, sous, eyebrow);
  const champ = el("input", { type: "search", id: id + "-q", placeholder: "Chercher…", "aria-label": "Chercher dans " + titre });
  const nb = el("span", { class: "sous" });
  const corps = el("div", { class: "carte md", "data-comment-target": "" });
  corps.innerHTML = markdown(texte.replace(/^# .*\n/, ""));
  const blocs = [...corps.querySelectorAll(":scope > ul > li, :scope > p, :scope > ol > li")];
  champ.addEventListener("input", () => {
    const q = champ.value.trim().toLowerCase(); let n = 0;
    blocs.forEach((b) => { const ok = !q || b.textContent.toLowerCase().includes(q); b.hidden = !ok; if (ok && q) n++; });
    corps.querySelectorAll("h2, h3, hr").forEach((h) => (h.hidden = !!q));
    nb.textContent = q ? `${n} résultat${n > 1 ? "s" : ""}` : "";
  });
  s.append(el("div", { class: "controles" }, el("label", { class: "champ", style: "flex:1;max-width:420px" }, el("span", {}, "Chercher"), champ), nb), corps);
}
