  - [2026-11-20, Choix de l'encodeur]
  - [2027-03-12, Soutenance]

# Travail en cours : ce qui est sur la table cette semaine.
en_cours:
  - titre: Partition des points d'écoute et plan de tirage
    etat: en_cours
    detail: >-
      Répartir les points d'écoute entre entraînement et test avant toute écoute (aucun point
      ne sert aux deux), puis tirer les extraits par point, heure et période.
    suite: Plan à valider par Sylvain et Élodie.
  - titre: Mode « extrait + intervalles » du poste d'annotation
    etat: en_cours
    detail: >-
      Annoter un extrait de 30 s en marquant les intervalles où A. blanci chante, plutôt que
      fenêtre par fenêtre.
    suite: Essai chronométré sur 50 extraits.
  - titre: Encodage du corpus avec perch_v2
    etat: en_cours
    detail: >-
      De 8,0 à 2,05 s par enregistrement de 2 min sur l'i5 (graphe réduit, lecture en avance,
      rééchantillonnage par enregistrement). Corpus entier : environ 54 h au lieu de 210 h.
    suite: Vérifier le câble du SSD externe, lu à 40 Mo/s (USB 2).
  - titre: Essai d'empaquetage .exe
    etat: a_venir
    detail: >-
      Vérifier tôt qu'une application Python avec ONNX Runtime s'installe et tourne sur une
      machine Windows propre.
    suite: Repli prévu, Gradio à la place de Streamlit.
  - titre: Vague 2 AnuraSet
    etat: en_cours
    detail: >-
      audioprotopnet, avesecho_passt et biolingual restent à ajouter au benchmark des
      encodeurs ; clôture le 09/10.
    suite: Puis plus aucun benchmark AnuraSet.

# Débit de l'encodage perch_v2 sur l'i5, secondes par enregistrement de 2 min.
debit:
  - [Origine, 8.0]
  - [Lot de 1, 7.3]
  - [Lecture en avance, 6.2]
  - [Calculs du signal allégés, 5.7]
  - [Rééchantillonnage par enregistrement, 4.9]
  - [Iris Xe (OpenVINO), 3.25]
  - ["Graphe réduit, CPU", 2.05]

# Plan d'annotation v1 (cibles) ; « fait » se met à jour à la main ou depuis la base locale.
annotation:
  - [Extraits d'entraînement (30 s), 0, 450]
  - [Enregistrements d'évaluation (2 min), 0, 250]
  - [Positifs à l'évaluation, 0, 60]

prochaines_etapes:
  - Partition des points d'écoute et plan de tirage
  - Mode « extrait + intervalles »
  - Première série d'annotations
  - Essai d'empaquetage .exe
