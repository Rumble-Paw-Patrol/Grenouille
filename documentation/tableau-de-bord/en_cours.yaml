# Travail en cours : LE SEUL FICHIER DU TABLEAU DE BORD À TENIR À LA MAIN.
# Un chantier = titre, etat (en_cours | a_venir | bloque | fait), detail, suite (prochaine action).
# Retirer un chantier quand il est fini. Puis : /tableau-de-bord (ou demander « mets à jour le
# tableau de bord »).

en_cours:
  - titre: Annotation de mes données
    etat: en_cours
    detail: >-
      Répartir les points d'écoute entre le training set et le test set avant toute écoute (pour éviter un data leakage), puis annoter les extraits par point d'écoute, heure, date.
    suite: Préparer la validation par k-fold
  - titre: Façonnement du poste d'annotation
    etat: en_cours
    detail: >-
      Software d'annotation d'enregistrements audio à part entière, on labelise les intervalles ou A. Blanci chante au sein de l'enregistrement.
    suite: Vérification de mes label par Élodie Courtois et Benoit Villette
  - titre: Encodage du corpus sur modèles de fondation
    etat: en_cours
    detail: >-
      Étape très longue : 61h pour Perch 2.0 sur CPU intel core i5, BirdNET encore en cours (estimé à 25h)
    suite: Une fois l'encodage et l'annotation terminée, entraînement des heads
  - titre: Benchmark des approches sur mon jeu de données
    etat: a_venir
    detail: >-
      Les Benchmarks pré-existant ont été réalisés sur AnuraSet. Ici on va tester les encodeurs et têtes de  classification à disposition sur notre dataset pour voir lequel performe le mieux.
  - titre: Création du module de traitement du signal
    etat: a_venir
    detail: >-
      Filtre passe-bande, PCEN, log-mel, débruitage spectral, energy-based candidate window extraction.   
    suite: Placement du module dans la pipeline, en amont ou en parallèle du couple foundation-model & head.
  - titre: Test d'une application Windows
    etat: a_venir
    detail: >-
      Vérifier tôt qu'une application Python avec ONNX Runtime s'installe et tourne sur une machine Windows propre. L'objectif étant à terme de fournir une appli no code pour naturalistes allergiques aux technologies.
    suite: Création de l'application Windows
  
