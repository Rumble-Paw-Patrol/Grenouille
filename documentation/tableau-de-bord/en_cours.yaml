# Travail en cours : LE SEUL FICHIER DU TABLEAU DE BORD À TENIR À LA MAIN.
# Un chantier = titre, etat (en_cours | a_venir | bloque | fait | termine), detail, suite (prochaine action).
# « termine » : chantier fini qu'on garde affiché, pastille verte « terminé ».
# Retirer un chantier quand il est fini. Puis : /tableau-de-bord (ou demander « mets à jour le
# tableau de bord »).

en_cours:
  - titre: Benchmark des encodeurs et des têtes sur AnuraSet
    etat: termine
    detail: >-
      Confection des sections de benchmark sur AnuraSet du tableau de bord : encodeurs et têtes à la carte, amorçage d'un site neuf. Plus le temps d'encodage du corpus ONF.
  - titre: Façonnement du poste d'annotation
    etat: termine
    detail: >-
      Software d'annotation d'enregistrements audio à part entière, on labelise les intervalles ou A. Blanci chante au sein de l'enregistrement.
    suite: Vérification de mes label par Élodie Courtois et Benoit Villette
  - titre: Annotation de mes données
    etat: en_cours
    detail: >-
      Répartir les points d'écoute entre le training set et le test set avant toute écoute (pour éviter un data leakage), puis annoter les extraits par point d'écoute, heure, date.
    suite: >-
      Partition des points et files tirées par plan (DECISIONS n° 196) : annoter le lot 1
      (424 extraits de 30 s), puis le jeu de test (250 enregistrements entiers). Ensuite,
      préparer la validation par k-fold.
  - titre: Extraction des embeddings des modèles de fondation
    etat: en_cours
    detail: >-
      Étape très longue : 61h pour Perch 2.0 sur CPU intel core i5, BirdNET 2.4 encore en cours (estimé à 25h)
    suite: Une fois l'encodage et l'annotation terminée, entraînement des heads
  - titre: Benchmark des encodeurs et têtes sur mon jeu de données
    etat: a_venir
    detail: >-
      Les Benchmarks pré-existant ont été réalisés sur AnuraSet. Nous allons par la suite tester les encodeurs (pas tous) et têtes de  classifications directement sur notre dataset quand ce dernier sera prêt.
  - titre: Création du module de traitement du signal
    etat: a_venir
    detail: >-
      Filtre passe-bande, PCEN, log-mel, débruitage spectral, extraction de fenêtres candidates basée sur l'énergie, seuil à hystérésis à ajouter.
    suite: Placement du module dans la pipeline, en amont ou en parallèle du couple foundation-model & head.
  - titre: Fabrication de notebooks
    etat: a_venir
    detail: >-
      Des notebooks pour voir ce que fait la chaîne, étape par étape, sur nos enregistrements :
      spectrogrammes avant et après le traitement du signal, voir le résultat de l'attention
      sur token sur le spectro, UMAPs en tout genre, scores des têtes, extraits annotés. De quoi
      vérifier chaque étape à l'œil, comprendre un faux positif, et montrer aux encadrants et
      aux naturalistes le travail plus en détail que sur le tableau de bord.
  - titre: Test d'une application Windows
    etat: a_venir
    detail: >-
      Vérifier tôt qu'une application Python avec ONNX Runtime s'installe et tourne sur une machine Windows propre. L'objectif étant à terme de fournir une appli no code pour naturalistes allergiques aux technologies. Claude Design devient vraiment utile pour le livrable : la maquette de l'application, à faire valider par l'ONF avant d'écrire l'interface.
    suite: Création de l'application Windows
