# Structure du projet pour le tableau de bord : ce que le code ne dit pas de lui-même (objectif,
# critères, étapes de la chaîne et leur état, plan d'annotation). Tenu à jour par Claude
# (skill tableau-de-bord) quand le code change ; le travail en cours est dans en_cours.yaml et
# le compteur d'annotations est lu dans la base locale.
#
# État d'une étape : fait | en_cours | a_venir | bloque

projet:
  titre: Outil de détection automatique d'Anomaloglossus blanci
  stage: [Stage de fin d'études, Office National des Forêts de Guyane, "6 mois, 15/09/2026 → 14/03/2027"]
  auteur: Léonard Laplace-Palette
  objectif: >-
    Développement d'un détecteur acoustique d'A. blanci en apprentissage continu capable de
    généraliser à de nouveaux points d'écoute jamais vus.
  depot: https://github.com/Rumble-Paw-Patrol/Grenouille
  criteres:
    - [1, Droit d'utilisation, "poids publics et licence qui permet l'usage commercial* par l'ONF"]
    - [2, Performance, "AP et rappel"]
    - [3, Facilité d'utilisation, "Application de bureau Windows sans écriture de code par les naturalistes"]
    - [4, Durée d'encodage, "si possible en heures pour une campagne d'écoute d'une semaine sur CPU de l'ONF"]

# Tuiles de la vue d'ensemble qui ne se lisent pas dans les CSV.
criteres_note: >-
  * Le caractère « usage commercial » est encore flou : reste à établir si l'utilisation du
  détecteur par l'ONF, établissement public à caractère industriel et commercial, tombe sous
  les clauses « non commerciales » de certaines licences de poids (CC BY-NC notamment).
meilleur_encodeur: [Perch 2.0, "Se démarque a priori devant BirdNET 2.4", "BirdNET 3.0 en preview"]

# Lieux : les relevés 2026 rattachés aux sites de la phénologie 2023 (présentation de suivi n° 2).
lieux: {CDR: Kaw, Patawa Est: Kaw, Patawa Ouest: Kaw, RNRT: Trésor}

# Chaîne de traitement. « etape » = nom affiché ; « module » = dossier ou fichier de blanci/ ;
# « tests » = dossier de tests/ dont on compte les tests ; « suite » = étapes suivantes.
chaine:
  - id: inventaire
    etape: Inventaire
    groupe: donnees
    module: blanci/inputs/ingest.py
    tests: tests/inputs
    commandes: [ingest, flag, status]
    etat: fait
    resume: >-
      Chaque enregistrement est rangé en base avec son jeu, son site, son micro et son heure.
      Les drapeaux écartent les fichiers de durée anormale ou hors relevé ; l'horloge douteuse
      n'est plus qu'une remarque.
    chiffre: 96 292 enregistrements, 3 204 h
    suite: [qc]
  - id: qc
    etape: Contrôle audio
    groupe: donnees
    module: blanci/inputs/qc.py
    tests: tests/inputs
    commandes: [qc]
    etat: fait
    resume: >-
      Une seule lecture de tout le corpus avant l'encodage, pour sortir les fichiers cassés ou
      sans rapport avec le projet (silencieux, micro resté dans le sac).
    chiffre: 96 109 enregistrements encodables
    suite: [signal]
  - id: signal
    etape: Traitement du signal
    groupe: signal
    module: blanci/heads/signal_processing.py
    tests: tests/heads
    commandes: [onsets]
    etat: en_cours
    resume: >-
      En amont de l'encodeur : filtre passe-bande, PCEN, log-mel, débruitage spectral et
      extraction des fenêtres candidates par l'énergie dans la bande 4,4–5,5 kHz. Mesure aussi
      le rythme (une note de 0,09 s toutes les 1,2 à 1,9 s), sans apprentissage. Les chants
      faibles ne sont pas encore retenus : seuil à hystérésis à ajouter.
    chiffre: bande 4,4–5,5 kHz
    suite: [encodage]
  - id: encodage
    etape: Encodage
    groupe: modele
    module: blanci/embedding
    tests: tests/embedding
    commandes: [embed, tokens]
    etat: en_cours
    resume: >-
      L'encodeur gelé transforme chaque fenêtre de 5 s en un vecteur (embedding), et en
      jetons pour les têtes qui les lisent. perch_v2 tourne sur le processeur du portable i5,
      sans carte graphique. Son modèle calcule aussi les scores de ses 14 795 espèces, dont on
      n'a pas besoin : on n'en garde que la partie qui produit l'embedding et les jetons, à
      résultat identique. Avec les autres optimisations, l'encodage passe de 8,0 à 2,05 s par
      enregistrement de 2 min.
    chiffre: 2,05 s par enregistrement de 2 min
    suite: [tetes]
  - id: tetes
    etape: Têtes de classification
    groupe: modele
    module: blanci/heads
    tests: tests/heads
    commandes: [train, heads, heads-curve, search]
    etat: fait
    resume: >-
      Une petite couche apprise sur les embeddings donne un score par fenêtre : logistique,
      prototypes, sonde attentive ou à prototypes sur les jetons, avec les régularisations
      contre « apprendre le site ». La recherche par similarité (plus proches voisins d'un
      exemple) est la référence à battre.
    chiffre: 14 têtes et régularisations comparées
    suite: [fusion]
  - id: fusion
    etape: Fusion (si besoin)
    groupe: modele
    module: blanci/combination
    tests: tests/interfaces
    commandes: [fusion, fusion-bench, ensemble]
    etat: fait
    optionnel: true
    resume: >-
      Entre la classification et le score, seulement si besoin : combiner plusieurs modèles
      (approche par ensemble), et/ou le score de la tête avec le module de traitement du
      signal si celui-ci est finalement placé en parallèle de l'encodeur plutôt qu'en amont.
    suite: [score]
  - id: score
    etape: Score et agrégation
    groupe: sortie
    module: blanci/results
    tests: tests/results
    commandes: [score, activity]
    etat: fait
    resume: >-
      Passe de la fenêtre à l'enregistrement puis au point d'écoute, avec un seuil par site ;
      produit les courbes d'activité pour une étude phénologique future.
    suite: [evaluation, verification]
  - id: evaluation
    etape: Évaluation
    groupe: sortie
    module: blanci/evaluation
    tests: tests/evaluation
    commandes: [evaluate, freeze, benchmark]
    etat: a_venir
    resume: >-
      AP et rappel par enregistrement sur des points tenus à l'écart et sur le jeu gelé. Sur
      les données ONF : seulement après le go des experts sur les annotations.
    chiffre: rappel ≥ 0,85 à précision ≥ 0,1 visé
  - id: verification
    etape: File de vérification
    groupe: annotation
    module: blanci/annotation/selection.py
    tests: tests/annotation
    commandes: [queue, select, candidates]
    etat: fait
    resume: >-
      Choisit quoi faire écouter : des extraits tirés selon le plan d'annotation pour le
      premier lot, puis la file d'apprentissage actif (60 % d'incertains, 20 % des meilleurs
      scores, 20 % au hasard).
    suite: [annotation]
  - id: annotation
    etape: Poste d'annotation
    groupe: annotation
    module: blanci/annotation/app.py
    tests: tests/annotation
    commandes: [annotate, clips-export, clips-import, label]
    etat: en_cours
    resume: >-
      Écoute dans le navigateur avec spectrogramme ; passerelle vers Raven ou Audacity. Mode
      « extrait + intervalles » en cours d'écriture.
    suite: [reentrainement]
  - id: reentrainement
    etape: Réentraînement
    groupe: annotation
    module: blanci/service.py
    tests: tests/interfaces
    commandes: [retrain]
    etat: fait
    resume: >-
      Une nouvelle tête est apprise sur tous les labels, jugée sur le jeu gelé, et adoptée
      seulement si elle n'est pas moins bonne.
    suite: [tetes]
# Commandes de recherche ou d'outillage, volontairement hors du schéma de la chaîne. Une
# commande de la CLI absente d'ici et de la chaîne est signalée comme nouvelle.
commandes_hors_chaine: [agreement, anuraset benchmark, anuraset campaign, anuraset heads,
  anuraset prepare, anuraset profile, baselines, benchmark-all, check-grid, cluster,
  cluster-label, cluster-status, detector-bench, export-labels, pca, prevalence,
  qc-calibrate, sources, throughput, upstream-bench]

# Plan d'annotation (présentation de suivi n° 2, décision avec Élodie du 29/09/2026, DECISIONS §5).
# Pas de point-virgule dans ces textes (demande de Léonard).
plan_annotation:
  contexte: >-
    Les prochaines campagnes dureront toutes une semaine, en saison des pluies, à Mataroni, sur
    de nouveaux points d'écoute. Le jeu de test imite cette situation avec des points de
    Mataroni jamais vus à l'entraînement. J'annote seul, puis Élodie et Benoît vérifient un
    sous-échantillon. Aucun benchmark n'est lancé sur ces données avant leur accord.
  etapes:
    - [Répartir les points, "Avant toute écoute, chaque point d'écoute est attribué soit à l'entraînement, soit au test, jamais aux deux."]
    - [Jeu d'entraînement, "Environ 450 extraits de 30 s, 3 par point d'écoute : un au pic du matin, un au pic du soir, un dans une autre tranche horaire."]
    - [Validation, "Validation croisée inter-micros et non intra-micros. Chaque pli met de côté des micros entiers, jamais quelques enregistrements d'un micro déjà vu. On mesure ainsi la généralisation à des paysages sonores jamais entendus. Elle sert à régler la tête sans jamais toucher au jeu de test."]
    - [Jeu de test, "Environ 250 enregistrements de 2 min écoutés en entier, sur les points tenus à l'écart, avec au moins 60 positifs pour mesurer le rappel avec une précision suffisante."]
    - [Vérification, "À l'aveugle, par Élodie et Benoît. Mon label est caché et l'ordre mélangé. Environ 2 h 30 d'écoute chacun."]
  principes:
    - [Annotations de l'ancien prestataire ignorées, "on repart de zéro, sans reprendre ses annotations, pour ne pas hériter de ses angles morts."]
    - [Peu d'enregistrements sur beaucoup de points, "plutôt que beaucoup d'enregistrements sur peu de points. Varier les paysages sonores aide le détecteur à généraliser."]
    - [Un tirage stratifié par point et par heure, "fait avant toute écoute. Chaque point et chaque tranche horaire fournit des extraits avec et sans chant, si bien que la tête apprend le chant et pas l'heure ni le lieu. Ensuite, à l'entraînement, chaque positif reçoit des négatifs tirés au même point et à la même heure (négatifs appariés)."]

# Apprentissage actif : les lots d'annotation suivants, après l'accord des experts (DECISIONS §5.9).
apprentissage_actif:
  contexte: >-
    Une fois le premier lot validé, le modèle aide à choisir quoi écouter ensuite. Ces lots ne
    servent qu'à l'entraînement, jamais au test.
  boucle:
    - [Score, "La tête en place note toutes les fenêtres encodées."]
    - [File de vérification, "60 % de fenêtres incertaines (les plus proches du seuil), 20 % des meilleurs scores, 20 % tirées au hasard par micro et par heure."]
    - [Poste d'annotation, "Logiciel d'écoute dans le navigateur : spectrogramme zoomable, écoute de la seule bande du chant, intervalles tracés à la souris, faux amis notés. Passerelle vers Raven ou Audacity."]
    - [Réentraînement, "Une nouvelle tête apprend sur tous les labels. Elle n'est adoptée que si elle fait au moins aussi bien sur le jeu de test gelé."]
  methodes:
    - [Récolte par similarité, "sur les points encore peu annotés, on cherche les fenêtres les plus proches d'un chant connu."]
    - [Négatifs difficiles, "on fait écouter les faux positifs les mieux classés, ceux qui trompent le plus la tête."]
    - [Contrôle des experts, "10 % de chaque lot, tirés au hasard, plus tout ce qui est noté incertain."]
    - [Seuil d'un nouveau site, "5 à 10 enregistrements positifs vérifiés sur place, car le seuil ne se transpose pas d'un site à l'autre."]

# Cibles du plan d'annotation v1 ; l'avancement est compté dans data/db/blanci.sqlite.
annotation_cibles:
  entrainement: 450      # enregistrements annotés hors jeu gelé (≈ un extrait de 30 s chacun)
  evaluation: 250        # enregistrements du jeu gelé, écoutés en entier
  positifs_evaluation: 60
