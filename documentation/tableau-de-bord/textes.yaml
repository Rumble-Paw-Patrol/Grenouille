# du titre), titres et légendes des cartes, phrases isolées. L'ordre des sections et le
# rangement sous AnuraSet se règlent dans modele.html (SECTIONS).
# ---------------------------------------------------------------------------------------------
sections:
  accueil:
    menu: Vue d'ensemble
    titre: Vue d'ensemble
    sous_titre: État d'avancement du projet et critères de choix du détecteur.
    cartes:
      criteres:
        titre: Critères de choix du détecteur
        legende: Critères appliqués dans cet ordre.
      en_developpement:
        titre: En développement

  en-cours:
    menu: En développement
    titre: En développement
    sous_titre: Ce qui est sur la table en ce moment, et ce qui a bougé dans le dépôt.
    cartes:
      commits:
        titre: Derniers changements du dépôt
        legende: >-
          Commits poussés sur main, numérotés depuis le premier : ce sont les numéros à donner à
          /audit-n-from.

  donnees:
    menu: Données
    titre: Données
    sous_titre: >-
      Inventaire des enregistrements de l'ONF (2 min, toutes les 30 min de 5 h à 20 h, 48 kHz
      stéréo). L'audio reste sur les disques, jamais dans le dépôt.
    cartes:
      heures:
        titre: Heures d'audio par site
        legende: Enregistrements de 2 min.
      fenetres:
        titre: Fenêtres à encoder
        legende: Chevauchement de moitié, sur les enregistrements de 120 s.

  chaine:
    menu: Chaîne de traitement
    titre: Chaîne de traitement
    sous_titre: >-
      Du fichier audio au score par point d'écoute. Cliquer une étape pour son détail ; en doré
      : la boucle d'annotation et de réentraînement ; pointillés gris : la fusion, seulement si
      besoin.

  annotation:
    menu: Annotation
    titre: Annotation
    sous_titre: >-
      Le premier lot, tiré sans aucun modèle, puis les lots suivants choisis par apprentissage
      actif.
    cartes:
      plan:
        titre: Plan d'annotation
      apprentissage_actif:
        titre: Apprentissage actif
      compteur:
        titre: Annotations par site et par micro
        legende: >-
          Enregistrements annotés avec et sans A. blanci, recomptés dans la base à chaque mise à
          jour du tableau de bord. Cliquer un site pour voir ses micros.
      poste:
        titre: Poste d'annotation
        legende: >-
          Mon outil d'annotation, une page Streamlit qui s'ouvre dans le navigateur (uv run
          blanci annotate). Work in progress.
    phrases:
      micros_absents: Détail par micro disponible au prochain comptage.
      titre_principes: Trois principes
      boucle: >-
        La boucle recommence : les nouveaux labels donnent une nouvelle tête, qui choisit les
        écoutes suivantes.
      titre_methodes: Méthodes de sélection

  encodage:
    menu: Temps d'encodage
    titre: Temps d'encodage
    sous_titre: >-
      Durée réelle pour encoder tout le corpus de l'ONF sur le processeur du portable i5. Une
      barre apparaît dès qu'un encodeur a fini, lue dans la base à la mise à jour du tableau de
      bord.
    cartes:
      encodage:
        titre: Encodage du corpus par encodeur

  anuraset:
    menu: AnuraSet
    surtitre: Pré-benchmark
    titre: AnuraSet
    sous_titre: >-
      Un pré-benchmark sur des anoures du Brésil, pour trier encodeurs et têtes avant de les
      essayer sur les données de l'ONF. Les trois sous-sections qui suivent en donnent les
      résultats.
    cartes:
      introduction:
        titre: Pourquoi AnuraSet, et comment on le lit
      jeu_reduit:
        titre: À quoi ressemble le jeu réduit
    phrases:
      titre_methode: "La méthode : un site tenu à l'écart à la fois"
      titre_unite: "Choix de l'unité : fenêtre ou minute"
      exemple_minute: >-
        Une minute d'AnuraSet, découpée en fenêtres (ici 12 de 5 secondes pour perch_v2). En vert, les fenêtres qui
        contiennent un chant et dans chaque case, le score que la tête leur donne. Au niveau
        minute, l'enregistrement est positif et son score est le plus haut des douze (encadré).
      titre_ap: "Lecture de l'AP : moyenne par site ou poolée"
      explication_ap: >-
        L'AP (précision moyenne) résume la courbe précision-rappel.
        Avec quatre plis, il y a deux façons de la calculer.
      titre_matrice: Qui chante où
      consigne_clic: >-
        Cliquez sur le nom d'un site, en tête de colonne, pour le tenir à l'écart comme dans un
        pli : le tableau montre alors sur quoi le modèle apprend et sur quoi il est jugé.
        Recliquez pour revenir.
      bouton_site: tenir à l'écart
      bouton_site_actif: site de test
      aide_matrice: >-
        Nombre de {unite} où chaque espèce chante, site par site, et en dessous la part que cela
        représente dans le site. Hachuré : l'espèce n'y chante pas.
      titre_signature: La signature des chants
      legende_signature: >-
        Durée des chants de chaque espèce, une ligne par espèce, rangées de la plus aiguë à la
        plus grave (fréquence dominante à gauche). Le point marque la durée médiane, la barre
        épaisse va du 1er au 3e quartile (la moitié des chants), le trait fin du 10e au 90e
        centile. En doré, A. blanci : une note plus brève que toutes, dans la bande de
        fréquence de DENMIN. Les chants de PHYCUV et LEPLAT dépassent souvent une fenêtre de
        3 s : un encodeur à fenêtres de 3 s les coupe en morceaux.

  encodeurs:
    menu: Benchmark des encodeurs
    surtitre: AnuraSet · 1 / 3
    titre: Benchmark des encodeurs
    sous_titre: >-
      Benchmark global : chaque encodeur jugé avec la tête adaptée à sa sortie, un site tenu à
      l'écart à la fois. Indicateur, pas verdict : le choix se fera sur les données de l'ONF.
    cartes:
      choix:
        titre: Choisir les encodeurs à comparer
        legende: >-
          Ils s'affichent dans le classement et sur le graphique. Pastille verte : libre
          d'accès.
      classement:
        titre: Classement des encodeurs
        legende: >-
          AP moyenne par site tenu à l'écart (minute, cinq espèces), avec la meilleure tête de
          chaque encodeur, choisie après coup. Cliquer un en-tête pour trier.
      debit:
        titre: Débit contre qualité
        legende: "Plein : libre d'accès."

  explorateur:
    menu: Explorateur des têtes
    surtitre: AnuraSet · 2 / 3
    titre: Explorateur des têtes
    sous_titre: >-
      Choisir ce qu'on compare : encodeurs, têtes, espèces, unité et lecture de l'AP. Les têtes
      sont rangées sous leur encodeur ; chaque point est une espèce, le trait la moyenne des
      espèces choisies.

  amorcage:
    menu: Amorcer un site
    surtitre: AnuraSet · 3 / 3
    titre: Amorcer un site neuf
    sous_titre: >-
      Pour observer comment se comportent les têtes sur un site nouveau, selon le nombre
      d'annotations qu'il a déjà reçues : AP sur le site tenu à l'écart en fonction du nombre de
      ses enregistrements positifs annotés (moyenne des espèces et des sites). Une couleur par
      tête, un trait par encodeur.
    cartes:
      courbes:
        titre: Les têtes face au peu d'annotations
        legende: >-
          k = 0 : le site neuf n'a encore aucune annotation, la tête n'a appris que sur les
          autres sites. « tout » : toutes ses annotations. Trois encodeurs au plus.

  rapports:
    menu: Rapports
    titre: Rapports de benchmark
    sous_titre: >-
      Les huit rapports complets, avec leurs figures. Chacun a ses données (CSV) et le script
      qui les redessine dans le dépôt.

  tableaux:
    menu: Tableaux
    titre: Tableaux de référence
    sous_titre: >-
      Un tableau par famille de méthodes : protocole, encodeurs, têtes, régularisations, fusion…
      Cliquer pour agrandir.

  biblio:
    menu: Bibliographie
    surtitre: documentation/biblio/biblio.md
    titre: Bibliographie
    sous_titre: Chaque référence avec ce qu'on en retient pour A. blanci.

# ---------------------------------------------------------------------------------------------
# Chaîne de traitement : nom de l'étape, texte du détail, repère chiffré (sous le nom)
# ---------------------------------------------------------------------------------------------
chaine:
  inventaire:
    etape: Inventaire
    resume: >-
      Chaque enregistrement est rangé en base avec sa campagne (phénologie 2023 ou
      campagne 2026), son site, son micro et son heure.
    chiffre: 96 292 enregistrements, 3 204 h
  qc:
    etape: Contrôle qualité
    resume: >-
      Une seule passe sur tout le corpus avant l'encodage. Des flags écartent les fichiers
      cassés ou sans rapport avec le projet : durée anormale, hors relevé, silencieux,
      micro resté allumé dans le sac. L'horloge douteuse n'est plus qu'une remarque.
    chiffre: 96 109 enregistrements encodables
  signal:
    etape: Traitement du signal
    resume: >-
      Facultatif : on ne sait pas encore s'il servira. Placé en amont de l'encodeur, il
      appliquerait un filtre passe-bande, le PCEN, le log-mel et un débruitage spectral,
      puis extrairait les fenêtres candidates par l'énergie dans la bande 4,4–5,5 kHz. Il
      mesure aussi le rythme du chant (une note de 0,09 s toutes les 1,2 à 1,9 s), sans
      apprentissage.
    chiffre: bande 4,4–5,5 kHz
  encodage:
    etape: Encodage
    resume: >-
      L'encodeur gelé transforme chaque fenêtre de 5 s en un embedding, et en tokens pour
      les têtes qui les lisent. perch_v2 tourne sur le processeur du portable i5, sans
      carte graphique. Suite aux optimisations, l'encodage est passé de 8,0 à 2,05 s par
      enregistrement de 2 min.
    chiffre: 2,05 s par enregistrement de 2 min
  tetes:
    etape: Têtes de classification
    resume: >-
      Une petite couche posée sur les embeddings donne un score par fenêtre. Têtes
      comparées : régression logistique, prototype (chaque fenêtre est comparée à la
      moyenne des exemples avec chant et à celle des exemples sans chant, sans
      apprentissage), sondes sur les tokens. Sur un nouveau site, on peut être amené à
      utiliser deux têtes différentes selon le nombre de données annotées : le prototype
      tant qu'il y a peu d'exemples, la logistique dès qu'il y en a assez.
  fusion:
    etape: Fusion (si besoin)
    resume: >-
      Entre la classification et le score, seulement si besoin : combiner plusieurs modèles
      (approche par ensemble), et/ou le score de la tête avec le module de traitement du
      signal si celui-ci est finalement placé en parallèle de l'encodeur plutôt qu'en amont.
  score:
    etape: Score et agrégation
    resume: >-
      Passe de la fenêtre à l'enregistrement puis au point d'écoute, avec un seuil par
      site. Produit les courbes d'activité pour une étude phénologique future.
  evaluation:
    etape: Évaluation
    resume: >-
      AP et rappel par enregistrement sur des points tenus à l'écart et sur le jeu gelé. Sur
      les données ONF : seulement après le go des experts sur les annotations.
    chiffre: rappel ≥ 0,85 à précision ≥ 0,1 visé
  verification:
    etape: File de vérification
    resume: >-
      Choisit quoi faire écouter. Pour le premier lot : des extraits tirés selon le plan
      d'annotation. Ensuite, plusieurs méthodes au choix dans le poste d'annotation : file
      60-20-20 (incertains, meilleurs scores, hasard), similarité à des chants connus,
      couverture (ce qu'on n'a jamais entendu), groupes d'embeddings, carte des
      embeddings, négatifs difficiles, détections isolées, trous dans un chant,
      enregistrements entiers tirés au hasard.
  annotation:
    etape: Poste d'annotation
    resume: >-
      Écoute dans le navigateur avec un spectrogramme zoomable, intervalles du chant
      tracés à la souris. Work in progress.
  reentrainement:
    etape: Réentraînement
    resume: >-
      Une nouvelle tête est apprise sur tous les labels, jugée sur le jeu gelé, et adoptée
      seulement si elle n'est pas moins bonne.

# ---------------------------------------------------------------------------------------------
# Section Annotation
# ---------------------------------------------------------------------------------------------
# Plan d'annotation (présentation de suivi n° 2, décision avec Élodie du 29/09/2026, DECISIONS §5).
# Pas de point-virgule dans ces textes (demande de Léonard).
plan_annotation:
  contexte: >-
    Les prochaines campagnes dureront toutes une semaine, en saison des pluies, à Mataroni, sur
    de nouveaux points d'écoute. Le jeu de test imite cette situation avec des points de
    Mataroni jamais vus à l'entraînement. J'annote seul, puis Élodie et Benoît vérifient un
    sous-échantillon. Aucun benchmark n'est lancé sur ces données avant leur accord.
  etapes:
    - [Répartir les points, "Avant toute écoute, chaque point d'écoute est attribué soit à l'entraînement, soit au test, jamais aux deux."]
    - [Jeu d'entraînement, "Environ 450 extraits de 30 s. 300 en 2026, 3 par point d'écoute : un au pic du matin, un au pic du soir, un dans une autre tranche horaire. 150 en 2023, 50 sur chacun des 3 micros d'entraînement, répartis sur l'année."]
    - [Validation, "Validation croisée en 5 plis inter-micros et non intra-micros. Chaque pli rassemble environ un cinquième des micros d'entraînement, entiers : jamais quelques enregistrements d'un micro déjà vu. On mesure ainsi la généralisation à des paysages sonores jamais entendus. Elle sert à régler la tête sans jamais toucher au jeu de test."]
    - [Jeu de test, "Environ 250 enregistrements de 2 min écoutés en entier, sur les points tenus à l'écart, avec au moins 60 positifs pour mesurer le rappel avec une précision suffisante."]
    - [Vérification, "Élodie et Benoît écoutent chacun 10 % de mes données annotées, à l'aveugle : mon label est caché et l'ordre mélangé."]
  principes:
    - [Annotations de l'ancien prestataire ignorées, "on repart de zéro, sans reprendre ses annotations, pour ne pas hériter de ses angles morts."]
    - [Peu d'enregistrements sur beaucoup de points, "plutôt que beaucoup d'enregistrements sur peu de points. Varier les paysages sonores aide le détecteur à généraliser."]
    - [Un tirage stratifié par point et par heure, "fait avant toute écoute. Chaque point et chaque tranche horaire fournit des extraits avec et sans chant, si bien que la tête apprend le chant et pas l'ambiance sonore de l'heure ni du lieu."]

# Apprentissage actif : les lots d'annotation suivants, après l'accord des experts (DECISIONS §5.9).
apprentissage_actif:
  contexte: >-
    Une fois le premier lot validé, le modèle aide à choisir quoi écouter ensuite. Ces lots ne
    servent qu'à l'entraînement, jamais au test.
  boucle:
    - [Score, "La tête en place note toutes les fenêtres encodées."]
    - [File de vérification, "Choisit les fenêtres à écouter, par la méthode qu'on veut (ci-dessous). Par défaut, la file 60-20-20 : 60 % d'incertaines (les plus proches du seuil), 20 % des meilleurs scores, 20 % au hasard par micro et par heure."]
    - [Poste d'annotation, "Logiciel d'écoute dans le navigateur : spectrogramme zoomable, écoute de la seule bande du chant, intervalles tracés à la souris, faux amis notés. Work in progress."]
    - [Réentraînement, "Une nouvelle tête apprend sur tous les labels. Elle n'est adoptée que si elle fait au moins aussi bien sur le jeu de test gelé."]
  methodes:
    - [Similarité, "les fenêtres les plus proches d'un chant connu, pour récolter des positifs sur les points encore peu annotés."]
    - [Couverture, "les fenêtres les plus éloignées de tout ce qui est déjà annoté : écouter ce qu'on n'a jamais entendu."]
    - [Groupes d'embeddings, "quelques fenêtres par groupe de sons qui se ressemblent. Un groupe homogène s'étiquette d'un coup."]
    - [Carte des embeddings, "une projection en 2D où l'on entoure à la main une zone de points pour l'écouter."]
    - [Négatifs difficiles, "faire écouter les fenêtres que la tête note haut alors qu'A. blanci n'y chante sûrement pas, et celles qui ressemblent aux faux amis déjà repérés (autres anoures, insectes). Une fois annotées négatives, elles apprennent à la tête ce qu'elle confond avec le chant."]
    - [Détections isolées et trous dans un chant, "de manière générale, les chants d'A. blanci s'étendent sur la durée : faux positif probable pour une détection isolée, faux négatif probable pour une fenêtre négative entourée de positives."]

# ---------------------------------------------------------------------------------------------
# Section AnuraSet : bloc d'introduction et légende du jeu réduit
# ---------------------------------------------------------------------------------------------
# Section AnuraSet : l'introduction aux trois sous-sections de pré-benchmark (encodeurs, têtes,
# amorçage). Sources : rapports 01, 07 et 08 de documentation/benchmarks/, DECISIONS n° 125,
# 133, 135, 138, 139, 141. Les chiffres du jeu réduit sont relus dans les CSV (construire.py).
anuraset:
  pourquoi: >-
    Choisir un encodeur et une tête demande des données annotées, et les nôtres ne le sont pas
    encore. Encoder tout le corpus de l'ONF coûte des dizaines d'heures par encodeur (61 h pour
    Perch 2.0) : on ne peut pas tous les essayer dessus. AnuraSet (Cañas et al. 2023, CC BY) est
    un jeu public d'anoures néotropicaux du Brésil, annotés au chant près, enregistrés sur
    plusieurs sites. Il sert de banc d'essai pour trier 24 encodeurs (inférences réalisées sur machines virtuelles) et des dizaines de têtes
    avant de payer l'encodage du corpus ONF.
  liens:
    - [Des anoures tropicaux, "Comme A. blanci : chants brefs et tonals, dans le bruit d'une forêt tropicale (insectes, pluie, autres anoures). DENMIN (5,3 kHz, notes brèves) est l'analogue le plus proche."]
    - [Plusieurs sites, "Quatre sites INCT, chacun avec son micro, sa végétation, son chœur. C'est notre situation : Kaw, Trésor, Mataroni… et demain des points d'écoute jamais annotés."]
    - [Généraliser à un site neuf, "Le cœur du projet. On ne demande pas au détecteur de reconnaître les sites qu'il a appris, mais de fonctionner là où il n'a pas encore écouté."]
    - ["Un indicateur, pas un verdict", "D'autres espèces qu'A. blanci, 2 à 4 sites par espèce. Le choix final se fera sur les données de l'ONF."]
  methode:
    - [Un site tenu à l'écart, "Quatre plis : à chaque pli, j'entraîne la tête sur trois sites et je la juge sur le quatrième, qu'elle n'a jamais vu. Une tête a aussi des réglages à fixer avant l'entraînement, par exemple le C de la régression logistique, qui dose la régularisation : trop peu, la tête apprend par cœur les exemples d'entraînement ; trop, elle n'apprend presque rien. Pour choisir ce réglage sans jamais regarder le site de test, je refais la même chose à l'intérieur des trois sites d'entraînement : j'en mets un de côté, j'entraîne sur les deux autres avec chaque valeur candidate, et je garde la valeur qui marche le mieux sur les sites mis de côté. Le site de test ne sert qu'à la note finale."]
    - [Apprentissage, "Pour entraîner la tête, je prends toutes les fenêtres où l'espèce chante (les positifs) dans les trois sites d'entraînement. Pour les fenêtres sans l'espèce (les négatifs), je n'en garde que 20 par positif, tirées au hasard dans le même site que ces positifs. Les garder toutes noierait quelques centaines de chants sous des milliers de fenêtres de bruit. Les tirer site par site garde dans l'entraînement le bruit de fond propre à chaque site, pour que la tête apprenne le chant et pas « tel site = chant »."]
    - [Évaluation, "Pour noter la tête sur le site de test, en revanche, je garde toutes ses fenêtres, sans en tirer un échantillon : 4 000 à 5 600 fenêtres de 5 s selon le site, dont souvent seulement quelques dizaines ou centaines avec l'espèce. C'est la proportion de chants qu'on rencontre vraiment sur le terrain (la prévalence réelle). Une tête qui laisse passer un peu de bruit est alors pénalisée comme elle le serait sur nos enregistrements de l'ONF ; avec seulement 20 négatifs par positif, elle aurait paru meilleure qu'elle n'est."]
    - [Comparaisons, "Chaque encodeur ou tête est comparé à une référence choisie d'avance (perch_v2 + logistique), sur exactement les mêmes enregistrements : c'est une comparaison appariée. Pour savoir si l'écart dépasse le hasard, je fais un bootstrap : je retire au sort, avec remise, les enregistrements de chaque site, je recalcule l'écart à chaque tirage, et la dispersion de ces écarts donne un intervalle de confiance. Comme je fais des dizaines de comparaisons à la fois, certaines paraîtraient significatives par pur hasard : la correction de Holm rend le seuil plus exigeant en conséquence. Limite : ce qui varie le plus, c'est le site, et avec 2 à 4 sites par espèce je ne peux pas tirer les sites au sort. L'intervalle ne mesure que la variation d'un enregistrement à l'autre, pas d'un site à l'autre : il est plus étroit qu'il ne devrait, donc optimiste."]
  unites:
    - [Fenêtre, "Chaque fenêtre (3, 5 ou 6 s selon l'encodeur) est une unité, positive si elle contient un chant de l'espèce. C'est ce que voit le détecteur et ce qu'on annote : la mesure la plus fine. Mais les encodeurs ne découpent pas tous la minute de la même façon : BirdNET en fenêtres de 3 s, Perch en 5 s, d'autres en 6 s. Une fenêtre de 3 s et une fenêtre de 5 s ne contiennent pas le même morceau de son, ni forcément le même chant : on ne note pas les mêmes objets, et leurs AP par fenêtre ne se comparent pas directement. Entre encodeurs qui ont la même grille (5 s), en revanche, chaque fenêtre est jugée par les deux : la comparaison est appariée, faite sur exactement les mêmes fenêtres."]
    - [Minute, "Chaque enregistrement d'une minute est une unité ; son score est le maximum de ses fenêtres. C'est la seule unité identique pour tous les encodeurs (comparaison appariée), et la plus proche de l'usage final : l'espèce chante-t-elle sur cet enregistrement, à ce point d'écoute ? Dans les benchmarks 01 à 06 elle s'appelle « enregistrement »."]
  lectures:
    - [AP moyenne par site, "À chaque pli, je calcule l'AP sur les seules fenêtres du site tenu à l'écart, avec les scores du modèle qui ne l'a jamais vu : une AP par site. Je fais ensuite la moyenne de ces AP. Un site où l'espèce ne chante pas est laissé de côté : sans aucun chant à retrouver, l'AP n'y a pas de sens. Elle ne juge que le classement à l'intérieur d'un site : les chants passent-ils devant le bruit sur un site neuf ? C'est la lecture principale pour choisir l'encodeur. Plus bruitée (peu de positifs par site), et non définie là où l'espèce est absente."]
    - [AP poolée, "Les scores des quatre plis, rendus par quatre modèles, sont mis bout à bout et jugés ensemble. Elle juge en plus l'échelle des scores : un même seuil vaut-il pour tous les sites ? Elle pénalise une tête dont les sites finissent sur des échelles différentes (centrage par site, C choisi pli par pli)."]
  lecture_conseil: >-
    Lire les deux côte à côte : un grand écart entre AP par site et AP poolée signale des sites
    sur des échelles différentes, donc un seuil qui ne voyagera pas. Sur AnuraSet c'est le cas
    d'une espèce présente sur deux sites seulement (PITAZU : rappel 0,01 au seuil appris
    ailleurs, 0,92 au seuil choisi sur place) ; chaque site neuf demandera son propre seuil.
  jeu: >-
    Le jeu complet compte 1 612 enregistrements d'une minute, 4 sites et 42 espèces. On garde
    1 599 enregistrements (1 206 aux chants datés et 393 sans aucune espèce, seuls négatifs
    sûrs) et les 5 espèces présentes sur au moins deux sites : sans deuxième site, impossible
    de mesurer le transfert.
  total_enregistrements: 1612
  total_especes: 42
